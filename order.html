<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Order — Laghman Express</title>
<meta name="description" content="Order pickup from Laghman Express — live menu and prices from each kitchen.">
<link rel="icon" href="assets/logo-symbol.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Instrument+Sans:wght@400;600&family=Playfair+Display:wght@600&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet">
<style>
/* Laghman Express /order v2 — standalone page, same design tokens as the site.
   Talks to the live ordering API; prices are server-authoritative.
   v2 incorporates the 51-finding audit: quote-sequence money guard, no cart
   wipe before payment, DOM-built modifier UI (no attr-concat), region-aware
   gate, per-language menu names, resilient error states. */
:root{
  --ink:#0b120e; --ink2:#111b14; --pine:#16301f; --pined:#0f2417;
  --paper:#f7f2e6; --paper2:#efe7d5; --cream:#f6f1e4;
  --cream60:rgba(246,241,228,.62); --cream40:rgba(246,241,228,.4);
  --gold:#e0b25c; --golds:#f0d49a; --goldi:#8a6420; --ember:#e2612b;
  --err:#8a2b12;
  --ease:cubic-bezier(.19,1,.22,1);
  --display:"Fraunces","Playfair Display","Noto Serif SC",Georgia,serif;
  --sans:"Instrument Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--cream);font-family:var(--sans);line-height:1.55;
  padding-bottom:calc(88px + env(safe-area-inset-bottom))}
:lang(zh-CN) h1,:lang(zh-CN) h2,:lang(zh-CN) h3{letter-spacing:0;line-height:1.16}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.02em;margin:0;line-height:1.02}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.shell{width:min(1100px,92vw);margin-inline:auto}
.eyebrow{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}

.hdr{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:.8rem;padding:.7rem 4vw;
  background:rgba(11,18,14,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(224,178,92,.2)}
.hdr img{width:30px;height:30px;object-fit:contain}
.hdr b{font-family:var(--display);font-size:1rem}
.hdr .back{color:var(--cream60);font-size:.85rem;margin-right:auto}
.hdr .back:hover{color:var(--cream)}
.lang{display:inline-flex;gap:2px;border:1px solid rgba(246,241,228,.28);border-radius:100px;padding:2px}
.lang button{padding:.22rem .55rem;border-radius:100px;font-size:.72rem;font-weight:700;color:var(--cream60)}
.lang button.on{background:var(--gold);color:#22160a}
.kbtn{display:inline-flex;align-items:center;gap:.45rem;border:1px solid rgba(224,178,92,.4);border-radius:100px;
  padding:.35rem .8rem;font-size:.8rem;color:var(--golds)}
.kbtn:hover{border-color:var(--gold)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.85rem 1.5rem;border-radius:100px;
  font-weight:600;font-size:.95rem;transition:transform .4s var(--ease),background .3s var(--ease)}
.btn-gold{background:var(--gold);color:#22160a}
.btn-gold:hover{background:var(--golds)}
.btn-gold:disabled{opacity:.45;cursor:default}
.btn-ghost{border:1px solid rgba(246,241,228,.3)}
.btn-ghost:hover{border-color:var(--cream)}
.paper-ghost{border:1px solid rgba(15,36,23,.3);color:var(--pined)}

/* gate */
#gate{padding:2.4rem 0 3rem}
#gate h1{font-size:clamp(1.9rem,5.5vw,3rem);max-width:22ch}
#gate .sub{color:var(--cream60);margin:.7rem 0 1.4rem;max-width:52ch}
.gacts{display:flex;flex-wrap:wrap;align-items:center;gap:.7rem;margin-bottom:1.2rem}
.geonote{color:var(--cream60);font-size:.85rem;margin:0 0 1rem}
.rgn{margin:1.4rem 0 .6rem;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.locs{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.loc{position:relative;text-align:left;border:1px solid rgba(246,241,228,.16);border-radius:10px;padding:1.1rem 1.1rem 1.2rem;
  background:var(--ink2);transition:border-color .4s var(--ease),transform .4s var(--ease)}
.loc:hover{border-color:rgba(224,178,92,.5);transform:translateY(-3px)}
.loc h3{font-size:1.25rem;margin:.15rem 0 .3rem}
.loc .area{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.loc .addr{color:var(--cream60);font-size:.88rem;line-height:1.45}
.loc .dist{position:absolute;top:.9rem;right:1rem;font-size:.8rem;color:var(--golds)}
.loc .tag{display:inline-block;margin-top:.6rem;font-size:.72rem;padding:.25rem .6rem;border-radius:100px;
  border:1px solid rgba(224,178,92,.35);color:var(--golds)}
.loc.phone .tag{border-color:rgba(246,241,228,.25);color:var(--cream60)}
.loc.nearest{border-color:var(--gold)}
.loc .near-chip{display:inline-block;margin:.5rem .4rem 0 0;font-size:.68rem;padding:.22rem .55rem;border-radius:100px;
  background:var(--gold);color:#22160a;font-weight:700}
.far{display:block;width:100%;text-align:left;margin-top:1.2rem;padding:.9rem 1.1rem;border:1px dashed rgba(246,241,228,.25);
  border-radius:10px;color:var(--cream60);font-size:.9rem}
.far:hover{border-color:var(--gold);color:var(--cream)}

/* menu */
#menu{display:none;padding:1.4rem 0 2rem}
.mhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:.6rem 1rem;margin-bottom:.4rem}
.mhead h1{font-size:clamp(1.5rem,4.2vw,2.2rem)}
.mhead .sw{font-size:.8rem;color:var(--cream60);text-decoration:underline;cursor:pointer}
.mnote{color:var(--cream60);font-size:.85rem;margin:.2rem 0 1rem}
.chips{position:sticky;top:52px;z-index:30;display:flex;gap:.5rem;overflow-x:auto;padding:.7rem 0;
  background:linear-gradient(var(--ink) 82%,transparent);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:.45rem .95rem;border-radius:100px;border:1px solid rgba(246,241,228,.2);
  font-size:.85rem;color:var(--cream60);white-space:nowrap}
.chip .alt{display:none}
.chip.on{background:var(--paper);color:var(--pined);border-color:var(--paper);font-weight:600}
.cat{margin:1.6rem 0 .4rem;scroll-margin-top:118px}
.cat h2{font-size:1.3rem;color:var(--golds)}
.cat h2 .alt{display:block;font-size:.72rem;color:var(--cream60);font-family:var(--sans);letter-spacing:0}
.items{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));margin-top:.7rem}
.it{display:flex;align-items:center;gap:.9rem;border:1px solid rgba(246,241,228,.12);border-radius:9px;
  padding:.8rem .95rem;background:var(--ink2);cursor:pointer;transition:transform .15s var(--ease)}
.it:active{transform:scale(.99)}
.it .nm{flex:1;font-size:.95rem;line-height:1.35}
.nm .alt{display:block;font-size:.76rem;color:var(--cream60);margin-top:.1rem}
.nm .zh-main{font-family:"Noto Serif SC",serif}
.sheet .nm .alt,.sheet .alt{color:rgba(15,36,23,.55)}
.it .pr{color:var(--golds);font-weight:600;white-space:nowrap}
.it .add{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--gold);color:#22160a;font-size:1.15rem;
  font-weight:700;display:grid;place-items:center;transition:background .3s var(--ease)}
.it .add:hover{background:var(--golds)}
.it .add:disabled{opacity:.6}
.skel{color:var(--cream40);padding:2rem 0;text-align:center}
.skrow{height:58px;border-radius:9px;margin:.6rem 0;background:linear-gradient(100deg,var(--ink2) 40%,#1a271e 50%,var(--ink2) 60%);
  background-size:200% 100%;animation:shim 1.2s linear infinite}
@keyframes shim{to{background-position:-200% 0}}

/* cart bar + drawer */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:45;display:none;justify-content:center;
  padding:.8rem 4vw calc(.8rem + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,rgba(11,18,14,.94) 40%)}
#bar .btn{width:min(560px,100%);justify-content:space-between}
@keyframes barpulse{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
#bar.pulse .btn{animation:barpulse .45s var(--ease)}
.overlay{position:fixed;inset:0;z-index:60;background:rgba(6,10,8,.8);backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .3s var(--ease);display:grid;align-items:end;justify-items:center}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:560px;max-height:88svh;overflow:auto;background:var(--paper);color:var(--pined);
  border-radius:14px 14px 0 0;padding:1.3rem 1.2rem calc(1.6rem + env(safe-area-inset-bottom));
  transform:translateY(24px);transition:transform .35s var(--ease)}
.overlay.open .sheet{transform:none}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:14px}}
.sheet h2{font-size:1.5rem;margin-bottom:.7rem}
.line{display:flex;align-items:center;gap:.7rem;padding:.55rem 0;border-bottom:1px solid rgba(15,36,23,.1)}
.line .nm{flex:1;font-size:.92rem;line-height:1.3}
.line .nm small{display:block;color:rgba(15,36,23,.6);font-size:.78rem}
.qty{display:inline-flex;align-items:center;gap:.55rem}
.qty button{width:26px;height:26px;border-radius:50%;border:1px solid rgba(15,36,23,.3);display:grid;place-items:center;font-weight:700}
.qty b{min-width:1.2ch;text-align:center}
.tot{display:grid;gap:.25rem;margin:1rem 0;font-size:.95rem;border-radius:8px;padding:.4rem .2rem}
.tot div{display:flex;justify-content:space-between}
.tot .g{font-weight:700;font-size:1.1rem}
@keyframes totflash{0%{background:#fdf3d8}100%{background:transparent}}
.tot.flash{animation:totflash 1.4s var(--ease)}
.muted{color:rgba(15,36,23,.62);font-size:.8rem}
.sheet .btn-gold{width:100%;margin-top:.6rem}
.sheet label{display:block;font-size:.8rem;font-weight:600;margin:.7rem 0 .25rem;color:rgba(15,36,23,.8)}
.sheet input{width:100%;padding:.7rem .8rem;border:1px solid rgba(15,36,23,.25);border-radius:8px;font:inherit;background:#fff}
.sheet input.bad{border-color:var(--err)}
.ferr{display:block;color:var(--err);font-size:.76rem;margin-top:.2rem}
.err{color:var(--err);font-size:.85rem;margin-top:.6rem;min-height:1.2em}
.notice{background:#fdf3d8;border:1px solid #e8d5a0;border-radius:8px;padding:.6rem .8rem;font-size:.85rem;margin:.6rem 0}
.xclose{position:sticky;top:0;float:right;font-size:1.1rem;opacity:.6;padding:.2rem .4rem}
.grp{margin:.8rem 0;padding-left:.5rem;border-left:3px solid transparent}
.grp.grp-err{border-left-color:var(--err)}
.grp.grp-err h3{color:var(--err)}
.grp h3{font-size:1.02rem;margin-bottom:.35rem}
.grp .req{display:inline-block;margin-left:.4rem;font-size:.64rem;padding:.1rem .45rem;border-radius:100px;
  background:rgba(138,43,18,.12);color:var(--err);font-weight:700;vertical-align:middle}
.grp .m{display:flex;align-items:center;gap:.6rem;padding:.4rem 0;font-size:.92rem}
.grp .m .pr{margin-left:auto;color:var(--goldi);font-weight:600}
.note-call{border:1px solid rgba(15,36,23,.2);border-radius:10px;padding:.9rem;margin-top:.8rem;font-size:.9rem}
.reassure{display:flex;gap:.5rem;align-items:flex-start;color:rgba(15,36,23,.7);font-size:.8rem;margin-top:.7rem;line-height:1.45}
.pickup-where{font-size:.85rem;font-weight:600;margin-top:.7rem;color:rgba(15,36,23,.85)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(34,22,10,.4);border-top-color:#22160a;
  border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header class="hdr">
  <a class="hdr-brand" href="./"><img src="assets/logo-symbol.png" alt=""></a>
  <b>Laghman Express</b>
  <a class="back" href="./" data-i="back"></a>
  <button class="kbtn" id="kbtn" hidden><span id="kname"></span> ↺</button>
  <span class="lang" id="lang"></span>
</header>

<section id="gate" class="shell">
  <p class="eyebrow" data-i="gateEyebrow"></p>
  <h1 data-i="gateH1"></h1>
  <p class="sub" data-i="gateSub"></p>
  <div class="gacts">
    <button class="btn btn-gold" id="geoBtn" data-i="nearMe"></button>
  </div>
  <p class="geonote" id="geoNote" hidden></p>
  <div id="locWrap"></div>
</section>

<section id="menu" class="shell">
  <div class="mhead">
    <h1 id="mTitle"></h1>
    <span class="sw" id="mSwitch" data-i="switchKitchen"></span>
  </div>
  <p class="mnote" data-i="liveNote"></p>
  <div class="chips" id="chips"></div>
  <div id="cats"></div>
</section>

<div id="bar"><button class="btn btn-gold" id="barBtn"><span data-i="cart"></span><span id="barTot"></span></button></div>

<div class="overlay" id="cartOv" role="dialog" aria-modal="true">
  <div class="sheet">
    <button class="xclose" data-x="cartOv">✕</button>
    <h2 data-i="yourOrder"></h2>
    <div id="lines"></div>
    <p class="notice" id="cartNotice" hidden></p>
    <div class="tot" id="totals"></div>
    <p class="muted" data-i="pickupOnly"></p>
    <div id="ckWrap"></div>
    <p class="err" id="cartErr"></p>
  </div>
</div>

<div class="overlay" id="modOv" role="dialog" aria-modal="true">
  <div class="sheet">
    <button class="xclose" data-x="modOv">✕</button>
    <h2 id="modName"></h2>
    <div id="modGroups"></div>
    <button class="btn btn-gold" id="modAdd"></button>
    <p class="err" id="modErr"></p>
  </div>
</div>

function uuid4(){
 if(crypto.randomUUID)return crypto.randomUUID();
 var b=new Uint8Array(16);crypto.getRandomValues(b);b[6]=b[6]&15|64;b[8]=b[8]&63|128;
 var h=Array.prototype.map.call(b,function(x){return (x+256).toString(16).slice(1)}).join("");

/* Clover names arrive bilingual in one string ("Dry Fried Noodles 干煸炒面").

var CJK=/[　-〿㐀-䶿一-鿿＀-￯]+/g;
function splitName(s){
 var zh=(s.match(CJK)||[]).join(" ").replace(/\s+/g," ").trim();
 var latin=s.replace(CJK," ").replace(/\s{2,}/g," ").replace(/\s+-\s*$/,"").replace(/^\s*-\s+/,"").trim();
 return {latin:latin,zh:zh};
}

function haversine(a,b,c,d){var R=3958.8,p=Math.PI/180;
 var x=Math.sin((c-a)*p/2),y=Math.sin((d-b)*p/2);
 return 2*R*Math.asin(Math.sqrt(x*x+Math.cos(a*p)*Math.cos(c*p)*y*y));}

 if(userPos){var best=null;KITCHENS.forEach(function(k){var d=haversine(userPos.lat,userPos.lng,k.lat,k.lng);
  if(!best||d<best.d)best={d:d,r:k.region}});return best.r}
 try{var r=localStorage.getItem("lx_region");if(r==="ny"||r==="ga")return r}catch(e){}
 return null;

function locCard(k,isNearest){

 if(k.api){node=el("button","loc");node.type="button";node.onclick=function(){pickKitchen(k.slug)}}
 else if(k.tel){node=el("a","loc phone");node.href="tel:"+k.tel}
 else{node=el("div","loc phone")}
 if(isNearest)node.classList.add("nearest");
 node.appendChild(el("span","area",k.area[lang]));
 if(k._d!=null)node.appendChild(el("span","dist",distLabel(k._d)));
 node.appendChild(el("h3",null,k.name));
 var addr=el("span","addr");addr.appendChild(document.createTextNode(k.addr));

function sortForGate(list){
 if(userPos){list.forEach(function(k){k._d=haversine(userPos.lat,userPos.lng,k.lat,k.lng)});
  list.sort(function(a,b){return a._d-b._d})}
 else{list.forEach(function(k){k._d=null});
  list.sort(function(a,b){return (b.api?1:0)-(a.api?1:0)})}
 return list;
}

var modCtx=null;
function tryAdd(it,btn){
 if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span>'}
 var restore=function(){if(btn){btn.disabled=false;btn.textContent="+"}};
 var flash=function(){if(btn){btn.disabled=false;btn.textContent="✓";
  setTimeout(function(){btn.textContent="+"},600)}};
 var cached=modCache[it.id];
 var p=cached?Promise.resolve(cached)
  :fetch(API+"/api/menu/"+state.slug+"/items/"+it.id+"/modifiers")
   .then(function(r){
    if(r.status===404)return {groups:[]};
    if(!r.ok)throw 0;
    return r.json()});
 p.then(function(m){
  modCache[it.id]=m;
  var groups=(m.groups||[]).filter(function(g){return g.modifiers&&g.modifiers.length});
  if(!groups.length){addLine(it,[],[]);flash();return}
  restore();
  modCtx={item:it,groups:groups};openMod();
 }).catch(function(){
  restore();
  renderCart();openSheet("cartOv");$("cartErr").textContent=T.netErr;
 });
}
function openMod(){
 $("modName").innerHTML="";$("modName").appendChild(nameNode(modCtx.item.name));
 var wrap=$("modGroups");wrap.innerHTML="";$("modErr").textContent="";
 modCtx.groups.forEach(function(g,gi){
  var min=g.minRequired||0,max=g.maxAllowed||0;
  var multi=!(max===1);
  var d=el("div","grp");d.id="grp-"+gi;
  var h=el("h3");h.appendChild(nameNode(g.name||T.choose));
  if(min>0)h.appendChild(el("span","req",T.required));
  d.appendChild(h);
  (g.modifiers||[]).forEach(function(mo){
   /* DOM-built: modifier ids/names are API data and must never be
      concatenated into markup (attribute-context XSS) */
   var l=el("label","m");
   var inp=document.createElement("input");
   inp.type=multi?"checkbox":"radio";inp.name="g"+gi;inp.value=mo.id;
   if(!multi&&min>=1&&g.modifiers.length===1)inp.checked=true;
   if(!multi&&min===0){ /* optional single-choice: second tap deselects */
    inp.addEventListener("click",function(){
     if(inp._was){inp.checked=false;inp._was=false}
     else{Array.prototype.forEach.call(document.getElementsByName("g"+gi),
       function(o){o._was=false});
      inp._was=true}
    });
   }
   var sp=document.createElement("span");sp.appendChild(nameNode(mo.name));
   l.appendChild(inp);l.appendChild(sp);
   if(mo.priceCents){l.appendChild(el("span","pr","+"+money(mo.priceCents)))}
   d.appendChild(l);
  });
  wrap.appendChild(d);
 });
 $("modAdd").textContent=T.add;
 openSheet("modOv");
}
$("modAdd").onclick=function(){

  var min=g.minRequired||0,max=g.maxAllowed||0;

   document.getElementById("grp-"+gi).classList.add("grp-err")}

/* ---- cart ---- */
function cartKey(){return "lx_cart_"+state.slug}
function loadCart(){
 try{
  var c=JSON.parse(localStorage.getItem(cartKey())||"[]");
  if(!Array.isArray(c))return [];
  return c.filter(function(l){return l&&typeof l.itemId==="string"&&typeof l.name==="string"})
   .map(function(l){
    l.quantity=Math.max(1,Math.min(20,parseInt(l.quantity,10)||1));
    if(!Array.isArray(l.modifierIds))l.modifierIds=[];
    l.modifierIds=l.modifierIds.filter(function(x){return typeof x==="string"});
    if(!Array.isArray(l.mods))l.mods=[];
    if(typeof l.key!=="string")l.key=l.itemId+"|"+l.modifierIds.slice().sort().join(",");
    return l;});
 }catch(e){return []}
}
function saveCart(){try{localStorage.setItem(cartKey(),JSON.stringify(state.cart))}catch(e){}}

 if(ln){ln.quantity=Math.min(20,ln.quantity+1)}
 else state.cart.push({key:key,itemId:it.id,name:it.name,mods:modNames,modifierIds:modIds,quantity:1});

}

function requestQuote(now){
 if(!state.cart.length){state.quote=null;state.idem=null;state.quoteErr=false;renderTotals();updateBar();return}
 /* invalidate immediately: nothing may pay against a stale quote */
 state.quote=null;state.idem=null;state.quoteBusy=true;state.quoteErr=false;
 renderTotals();updateBar();
 clearTimeout(quoteTimer);
 var seq=++quoteSeq;
 quoteTimer=setTimeout(function(){
  fetch(API+"/api/quotes",{method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({locationSlug:state.slug,fulfillment:"pickup",
    cart:state.cart.map(function(l){return{itemId:l.itemId,quantity:l.quantity,modifierIds:l.modifierIds}})})})
  .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})})
  .then(function(res){
   if(seq!==quoteSeq)return;
   state.quoteBusy=false;
   if(res.ok){state.quote=res.j;state.quoteFails=0;$("cartErr").textContent=""}
   else{
    state.quoteErr=true;state.quoteFails++;
    /* an item may have left today's menu — refresh menu + prune, then the
       user can retry against the pruned cart */
    if(state.quoteFails===1&&state.menu){
     fetch(API+"/api/menu/"+state.slug).then(function(r){return r.ok?r.json():null})
     .then(function(m){if(m&&seq===quoteSeq){state.menu=m;renderMenu();pruneCart();renderCart()}});
    }
    $("cartErr").textContent=res.j&&res.j.error||T.netErr;
   }
   renderTotals();updateBar();})
  .catch(function(){
   if(seq!==quoteSeq)return;
   state.quoteBusy=false;state.quoteErr=true;state.quoteFails++;
   renderTotals();updateBar();});
 },now?0:450);
}

}
function hostedActive(){return state.cfg&&state.cfg.paymentsEnabled&&state.cfg.checkoutMode==="hosted_checkout"}
var ckMode=null; /* build the form once; rebuilding on every qty tap would wipe typed input */
function renderCheckout(){
 var w=$("ckWrap");
 if(!state.cart.length){w.innerHTML="";ckMode=null;return}
 var mode=hostedActive()?"pay":"call";
 if(ckMode===mode){syncPayBtn();return}
 ckMode=mode;w.innerHTML="";
 var k=kitchen();
 if(mode==="pay"){
  var saved={};try{saved=JSON.parse(localStorage.getItem("lx_customer")||"{}")||{}}catch(e){}
  [["cN","name","name"],["cP","phone","tel"],["cE","email","email"]].forEach(function(f){
   w.appendChild(el("label",null,T[f[1]]));
   var inp=document.createElement("input");
   inp.id=f[0];inp.autocomplete=f[2];
   if(f[0]==="cP"){inp.inputMode="tel";inp.enterKeyHint="next"}
   else if(f[0]==="cE"){inp.inputMode="email";inp.enterKeyHint="go"}
   else inp.enterKeyHint="next";
   if(saved[f[1]])inp.value=saved[f[1]];
   inp.addEventListener("input",function(){state.idem=null;if(inp._err)validateField(f[0])});
   inp.addEventListener("blur",function(){if(inp.value)validateField(f[0])});
   inp.addEventListener("focus",function(){setTimeout(function(){inp.scrollIntoView({block:"center"})},250)});
   inp.addEventListener("keydown",function(e){if(e.key==="Enter"){
    if(f[0]==="cE")startHosted();else{var nx=$(f[0]==="cN"?"cP":"cE");nx&&nx.focus()}}});
   w.appendChild(inp);
   var fe=el("small","ferr","");fe.id=f[0]+"err";w.appendChild(fe);
  });
  var btn=el("button","btn btn-gold");btn.id="payBtn";btn.type="button";btn.onclick=startHosted;
  w.appendChild(btn);
  if(k)w.appendChild(el("p","pickup-where",T.pickupAtLbl+" "+k.name+" · "+k.addr));
  var re=el("p","reassure");re.appendChild(el("span",null,"🔒"));
  re.appendChild(el("span",null,T.payNote));w.appendChild(re);
  syncPayBtn();
 }else{
  var box=el("div","note-call");
  box.appendChild(document.createTextNode(T.notActive));
  box.appendChild(document.createElement("br"));box.appendChild(document.createElement("br"));
  if(k&&k.tel){var a=el("a","btn btn-gold",T.call+" · "+k.phone);a.href="tel:"+k.tel;box.appendChild(a)}
  w.appendChild(box);
 }
}
function syncPayBtn(){
 var btn=$("payBtn");if(!btn||btn._busy)return;
 if(state.quoteBusy||!state.quote){btn.disabled=true;btn.textContent=T.quoteWait}
 else{btn.disabled=false;btn.textContent=T.payOnline+" · "+money(state.quote.totalCents)}
}
function validateField(id){
 var inp=$(id);if(!inp)return true;
 var v=inp.value.trim(),ok=true,msg="";
 if(id==="cN"){ok=v.length>=2;msg=T.fName}
 if(id==="cP"){ok=v.replace(/\D/g,"").length>=7;msg=T.fPhone}
 if(id==="cE"){ok=/.@./.test(v);msg=T.fEmail}
 inp._err=!ok;
 inp.classList.toggle("bad",!ok);
 var fe=$(id+"err");if(fe)fe.textContent=ok?"":msg;
 return ok;
}
function startHosted(){
 var okN=validateField("cN"),okP=validateField("cP"),okE=validateField("cE");
 if(!okN){$("cN").focus();return}
 if(!okP){$("cP").focus();return}
 if(!okE){$("cE").focus();return}
 if(state.quoteBusy||!state.quote){$("cartErr").textContent=T.quoteWait;requestQuote(true);return}
 /* quotes live 10 min — never pay against one about to die */
 var exp=state.quote.expiresAt?Date.parse(state.quote.expiresAt):0;
 if(exp&&exp-Date.now()<30000){requestQuote(true);return}
 if(!state.idem)state.idem=uuid4();
 var n=$("cN").value.trim(),p=$("cP").value.trim(),e=$("cE").value.trim();
 var btn=$("payBtn");btn._busy=true;btn.disabled=true;
 btn.innerHTML='<span class="spin"></span> '+money(state.quote.totalCents);
 var unbusy=function(){btn._busy=false;syncPayBtn()};
 fetch(API+"/api/hosted-checkout/sessions",{method:"POST",
  headers:{"Content-Type":"application/json","Idempotency-Key":state.idem},
  body:JSON.stringify({quoteId:state.quote.quoteId,menuVersion:state.quote.menuVersion,
   expectedTotalCents:state.quote.totalCents,customer:{name:n,phone:p,email:e}})})
 .then(function(r){return r.json().then(function(j){return{s:r.status,j:j}})})
 .then(function(res){
  if(res.s===201&&res.j.href){
   try{localStorage.setItem("lx_customer",JSON.stringify({name:n,phone:p,email:e}))}catch(x){}
   /* cart is NOT cleared here — order-status clears it on confirmed payment,
      so backing out of Clover keeps the order intact */
   location.href=res.j.href;return}
  unbusy();
  if(res.j&&res.j.code==="PRICE_CHANGED"){state.idem=null;
   $("cartErr").textContent="";
   var nl=$("cartNotice");nl.textContent=T.priceChanged;nl.hidden=false;
   requestQuote(true);flashTotals();return}
  if(res.j&&res.j.code==="HOSTED_CHECKOUT_NOT_ACTIVE"){state.cfg=null;ckMode=null;fetchCfg();return}
  $("cartErr").textContent=res.j&&res.j.error||T.netErr;})
 .catch(function(){unbusy();$("cartErr").textContent=T.netErr});
}
/* bfcache return from Clover: reset the button, key and quote */
window.addEventListener("pageshow",function(e){
 if(!e.persisted)return;
 var b=$("payBtn");if(b)b._busy=false;
 state.idem=null;
 if(state.slug){state.cart=loadCart();updateBar();if(state.cart.length)requestQuote(true)}
});

/* ---- boot ---- */
applyLang();renderGate();
var saved=null;try{saved=localStorage.getItem("lx_kitchen")}catch(e){}
var qk=new URLSearchParams(location.search).get("k");if(qk)saved=qk;
var savedK=null;
if(saved){for(var i=0;i<KITCHENS.length;i++)if(KITCHENS[i].slug===saved&&KITCHENS[i].api)savedK=KITCHENS[i];}
if(savedK){pickKitchen(savedK.slug)}
else if(navigator.permissions&&navigator.permissions.query){
 navigator.permissions.query({name:"geolocation"}).then(function(st){
  if(st.state==="granted")$("geoBtn").click();}).catch(function(){});
}
})();
</script>
</body>
</html>
