<style>
/* Laghman Express /order v2 — standalone page, same design tokens as the site.
   Talks to the live ordering API; prices are server-authoritative.
   v2 incorporates the 51-finding audit: quote-sequence money guard, no cart
   wipe before payment, DOM-built modifier UI (no attr-concat), region-aware
   gate, per-language menu names, resilient error states. */
:root{
  --ink:#0b120e; --ink2:#111b14; --pine:#16301f; --pined:#0f2417;
  --paper:#f7f2e6; --paper2:#efe7d5; --cream:#f6f1e4;
  --cream60:rgba(246,241,228,.62); --cream40:rgba(246,241,228,.4);
  --gold:#e0b25c; --golds:#f0d49a; --goldi:#8a6420; --ember:#e2612b;
  --err:#8a2b12;
  --ease:cubic-bezier(.19,1,.22,1);
  --t-1:clamp(2rem,5.5vw,3rem);  /* page display */
  --t-2:1.5rem;                  /* sheet titles */
  --t-3:1.25rem;                 /* category, kitchen name, group */
  --t-4:1rem;                    /* body, dish name */
  --t-5:.875rem;                 /* secondary */
  --t-6:.8125rem;                /* labels */
  --t-7:.75rem;                  /* micro */
  --sh-1:inset 0 1px 0 rgba(246,241,228,.05),0 2px 6px -2px rgba(3,8,5,.55);
  --sh-2:inset 0 1px 0 rgba(246,241,228,.09),0 10px 24px -8px rgba(3,8,5,.82);
  --sh-sheet:0 -2px 10px rgba(3,8,5,.35),0 -26px 70px -14px rgba(3,8,5,.72);
  --display:"Fraunces","Noto Serif SC",Georgia,serif;
  --sans:"Instrument Sans",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.ico{flex:0 0 auto;display:block}
::selection{background:var(--gold);color:#22160a}
.sheet ::selection{background:var(--pined);color:var(--paper)}
html{scrollbar-width:thin;scrollbar-color:rgba(224,178,92,.38) var(--ink)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--ink)}
::-webkit-scrollbar-thumb{background:rgba(224,178,92,.32);border-radius:100px;
  border:3px solid var(--ink);background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(224,178,92,.5);background-clip:padding-box}
.sheet ::-webkit-scrollbar-track{background:var(--paper)}
.sheet ::-webkit-scrollbar-thumb{background:rgba(15,36,23,.28);border-color:var(--paper)}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--cream);font-family:var(--sans);line-height:1.55;
  padding-bottom:calc(88px + env(safe-area-inset-bottom));
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
body.locked{position:fixed;left:0;right:0;width:100%;overflow:hidden}
:lang(zh-CN) h1,:lang(zh-CN) h2,:lang(zh-CN) h3{letter-spacing:0;line-height:1.16}
:lang(zh-CN) .eyebrow,:lang(zh-CN) .rgn,:lang(zh-CN) .loc .area,:lang(zh-CN) .loc .tag{letter-spacing:0}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.025em;margin:0;
  line-height:1.08;text-wrap:balance}
#gate h1,.mhead h1{line-height:1.03}
#gate .sub,.mnote,.loc .addr,.nm .desc,.notice,.err,.reassure,.note-call,#modDesc{text-wrap:pretty}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
button,a,input,label{touch-action:manipulation}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sheet button:focus-visible,.sheet a:focus-visible,.sheet input:focus-visible{outline-color:var(--goldi)}
.pr,.tot,#barTot,.qty b,.dist,.lp,.zip,#modAdd,#payBtn{font-variant-numeric:tabular-nums}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
}
.shell{width:min(1100px,92vw);margin-inline:auto}

.hdr{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:.8rem;
  padding:max(.7rem,env(safe-area-inset-top)) max(4vw,env(safe-area-inset-right)) .7rem max(4vw,env(safe-area-inset-left));
  background:rgba(11,18,14,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(224,178,92,.2)}
.hdr img{width:30px;height:30px;object-fit:contain}
.hdr b{font-family:var(--display);font-size:1rem;white-space:nowrap}
.hdr .back{color:var(--cream60);font-size:.85rem;margin-right:auto;padding:.4rem 0}
.lang{display:inline-flex;gap:2px;border:1px solid rgba(246,241,228,.28);border-radius:100px;padding:2px}
.lang button{padding:.45rem .65rem;border-radius:100px;font-size:.72rem;font-weight:700;color:var(--cream60)}
.lang button.on{background:var(--gold);color:#22160a}
.kbtn{display:inline-flex;align-items:center;gap:.45rem;border:1px solid rgba(224,178,92,.4);border-radius:100px;
  padding:.45rem .8rem;font-size:.8rem;color:var(--golds)}
#kname{max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:640px){
  .hdr{flex-wrap:nowrap;gap:.55rem;padding-top:.5rem;padding-bottom:.5rem}
  .hdr .back{display:none}
  .hdr b{margin-right:auto}
  #kname{max-width:40vw}
}
@media(max-width:480px){.hdr b{display:none}.hdr-brand{margin-right:auto}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.85rem 1.5rem;border-radius:100px;
  font-weight:600;font-size:.95rem;transition:transform .25s var(--ease),background .3s var(--ease)}
.btn:active{transform:scale(.97)}
.btn-gold{background:var(--gold);color:#22160a}
.btn-gold:disabled{opacity:.45;cursor:default}
#gate .btn-gold:disabled,#geoBtn:disabled{opacity:1;background:rgba(224,178,92,.2);
  color:var(--golds);box-shadow:inset 0 0 0 1px rgba(224,178,92,.45);cursor:default}
.btn-ghost{border:1px solid rgba(246,241,228,.3)}
.paper-ghost{border:1px solid rgba(15,36,23,.3);color:var(--pined)}
@media(hover:hover){
  .hdr .back:hover{color:var(--cream)}
  .kbtn:hover{border-color:var(--gold)}
  .btn-gold:hover{background:var(--golds)}
  .btn-ghost:hover{border-color:var(--cream)}
}

/* gate */
#gate{padding:3.4rem 0 3rem}
#gate h1{font-size:var(--t-1);max-width:20ch}
#gate .sub{color:var(--cream60);margin:1rem 0 1.6rem;max-width:52ch;font-size:var(--t-4)}
.gacts{display:flex;flex-wrap:wrap;align-items:center;gap:.7rem;margin-bottom:1.2rem}
.geonote{color:var(--cream60);font-size:.85rem;margin:0 0 1rem}
.zipw{display:inline-flex;gap:.4rem}
.zip{width:11ch;border:1px solid rgba(246,241,228,.3);border-radius:100px;padding:.7rem 1rem;background:var(--ink2);color:var(--cream);font:inherit}
.zip{caret-color:var(--gold)}
.zip::placeholder{color:var(--cream40)}
.rgn{margin:1.4rem 0 .6rem;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.locs{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.loc{position:relative;text-align:left;border:1px solid rgba(246,241,228,.16);border-radius:11px;padding:1.1rem 1.1rem 1.2rem;
  box-shadow:var(--sh-1);
  background:var(--ink2);transition:border-color .4s var(--ease),transform .4s var(--ease)}
@media(hover:hover){
  button.loc:hover,a.loc:hover{border-color:rgba(224,178,92,.5);transform:translateY(-3px)}
}
button.loc:active,a.loc:active{transform:scale(.99)}
.loc h3{font-size:var(--t-3);margin:0 0 .35rem}
.loc .area{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.loc .addr{color:var(--cream60);font-size:.88rem;line-height:1.45}
.loc .dist{position:absolute;top:.9rem;right:1rem;font-size:.8rem;color:var(--golds)}
.loc .tag{display:inline-flex;align-items:center;gap:.4rem;margin-top:.9rem;font-size:var(--t-6);
  font-weight:600;padding:.5rem 1rem;border-radius:100px;background:var(--gold);color:#22160a;
  transition:background .3s var(--ease)}
.loc.phone .tag,.loc:not(.phone):has(+ *) .tag{}
@media(hover:hover){.loc:hover .tag{background:var(--golds)}}
.loc.phone .tag{background:none;border:1px solid rgba(246,241,228,.28);color:var(--cream60);font-weight:400}
.loc.nearest{border-color:var(--gold)}
.loc .near-chip{display:inline-block;margin:.5rem .4rem 0 0;font-size:.68rem;padding:.22rem .55rem;border-radius:100px;
  background:var(--gold);color:#22160a;font-weight:700}
.far{display:block;width:100%;text-align:left;margin-top:1.2rem;padding:.9rem 1.1rem;border:1px dashed rgba(246,241,228,.25);
  border-radius:10px;color:var(--cream60);font-size:.9rem}
@media(hover:hover){.far:hover{border-color:var(--gold);color:var(--cream)}}

/* menu */
#menu{display:none;padding:1.4rem 0 2rem}
.mhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:.6rem 1rem;margin-bottom:.4rem}
.mhead h1{font-size:clamp(1.6rem,4.2vw,2.3rem)}
.mhead .sw{font-size:.8rem;color:var(--cream60);cursor:pointer;text-decoration:underline;
  text-decoration-thickness:1px;text-underline-offset:4px;text-decoration-color:rgba(246,241,228,.4)}
.mnote{color:var(--cream60);font-size:.85rem;margin:.2rem 0 1rem}
.chips{position:sticky;top:var(--hdrh,52px);z-index:30;display:flex;gap:.5rem;overflow-x:auto;
  padding:.7rem 4px;margin-inline:-4px;scroll-padding-inline:4px;
  background:linear-gradient(var(--ink) 82%,transparent);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:.55rem 1rem;border-radius:100px;border:1px solid rgba(246,241,228,.2);
  font-size:.85rem;color:var(--cream60);white-space:nowrap;
  transition:background .25s var(--ease),color .25s var(--ease),transform .2s var(--ease)}
.chip:active{transform:scale(.96)}
.chip .alt{display:none}
.chip.on{background:var(--paper);color:var(--pined);border-color:var(--paper);font-weight:600}
.cat{margin:3rem 0 0;scroll-margin-top:calc(var(--hdrh,52px) + 66px)}
.cat:first-child{margin-top:1.4rem}
.cat h2{font-size:var(--t-3);line-height:1.14;color:var(--golds);margin:0 0 .2rem}
.cat h2 .alt{display:block;font-size:.72rem;color:var(--cream60);font-family:var(--sans);letter-spacing:0}
.items{display:grid;gap:.55rem;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  align-items:start;margin-top:1rem}
@media(min-width:900px){.items{grid-template-columns:repeat(auto-fill,minmax(430px,1fr))}}
.it{display:flex;align-items:stretch;gap:0;border:1px solid rgba(246,241,228,.12);border-radius:10px;
  box-shadow:var(--sh-1);overflow:hidden;min-height:92px;
  background:var(--ink2);cursor:pointer;transition:transform .15s var(--ease),border-color .3s var(--ease)}
.it>.nm,.it>.pr,.it>.add{align-self:center}
.it .nm{padding:.85rem 0 .85rem .95rem}
.it .pr{padding-inline:.85rem}
.it .add{margin-right:.85rem}
.it:active{transform:scale(.99)}
/* the photo is a rail that fills the row; a dish without one gets the brand
   mark on a quiet tile, so the left edge of the list never breaks rhythm */
.it .th{flex:0 0 auto;width:84px;align-self:stretch;object-fit:cover;background:#16211a;
  clip-path:inset(0 100% 0 0);transition:clip-path .38s var(--ease)}
.it .noph{flex:0 0 auto;width:84px;align-self:stretch;display:grid;place-items:center;
  background:linear-gradient(150deg,#182420,#111b14)}
.it .noph img{width:34px;height:28px;opacity:.26}
/* narrow phones: give the dish name back the room the photo takes */
@media(max-width:430px){
  .it{min-height:84px}
  .it .th,.it .noph{width:74px}
  .it .nm{padding:.75rem 0 .75rem .8rem}
  .it .pr{padding-inline:.7rem;font-size:.9rem}
  .it .add{margin-right:.7rem}
}
.it .th.on{clip-path:inset(0)}
.it .nm{flex:1;min-width:0;font-size:var(--t-4);line-height:1.32}
.nm .alt{display:block;font-size:.76rem;color:var(--cream60);margin-top:.1rem}
.nm .desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-size:var(--t-6);color:var(--cream60);margin-top:.25rem;line-height:1.45;font-weight:400}
.sheet .desc{color:rgba(15,36,23,.68)}
#fulfil{margin:.9rem 0 .2rem}
.segs{display:flex;gap:.4rem;background:rgba(15,36,23,.06);border-radius:100px;padding:3px}
.segs button{flex:1 1 0;padding:.55rem .6rem;border-radius:100px;font-size:var(--t-6);font-weight:600;
  color:rgba(15,36,23,.62);transition:background .3s var(--ease),color .3s var(--ease)}
.segs button.on{background:var(--paper,#f7f2e6);color:var(--pine-deep,#122618);box-shadow:0 1px 3px rgba(3,8,5,.14)}
.segs button[disabled]{opacity:.4}
#addrWrap{margin-top:.6rem}
#addrIn{width:100%;padding:.7rem .9rem;border-radius:14px;border:1px solid rgba(15,36,23,.22);
  font:inherit;font-size:var(--t-5);background:#fff;color:var(--pine-deep,#122618)}
#addrIn:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
#addrNote{margin:.4rem 0 0;font-size:var(--t-6)}
#addrNote.bad{color:#a8321d}
#addrTerms{margin:.3rem 0 0;font-size:var(--t-7);color:rgba(15,36,23,.55)}
.tot .stale{opacity:.45;transition:opacity .3s var(--ease)}
.addr-field{position:relative}
#addrList{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;margin:0;padding:.25rem;
  list-style:none;background:#fff;border:1px solid rgba(15,36,23,.16);border-radius:14px;
  box-shadow:0 12px 28px -10px rgba(3,8,5,.32);max-height:230px;overflow:auto}
#addrList li{padding:.55rem .7rem;border-radius:10px;font-size:var(--t-6);cursor:pointer;
  color:var(--pine-deep,#122618)}
#addrList li[aria-selected="true"],#addrList li:hover{background:rgba(15,36,23,.07)}
#addrList li b{font-weight:600}
#addrIn.busy{background-image:none}
.nm .zh-main{font-family:"Noto Serif SC",serif}
.sheet .nm .alt,.sheet .alt{color:rgba(15,36,23,.72)}
.it .pr{color:var(--golds);font-weight:600;white-space:nowrap;font-size:var(--t-5)}
.it .add{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:var(--gold);color:#22160a;font-size:1.15rem;
  font-weight:700;display:grid;place-items:center;transition:background .3s var(--ease),transform .2s var(--ease)}
@media(hover:hover){.it .add:hover{background:var(--golds)}}
.it .add:active{transform:scale(.9)}
.it .add:disabled{opacity:.6}
.skel{color:var(--golds);padding:1.6rem 0 .6rem;text-align:center;font-size:var(--t-5)}
.skrow{height:92px;border-radius:10px;margin:.55rem 0;border:1px solid rgba(246,241,228,.08);
  background-image:linear-gradient(100deg,var(--ink2) 40%,#1a271e 50%,var(--ink2) 60%);
  background-size:200% 100%;animation:shim 1.2s linear infinite}
@media(max-width:430px){.skrow{height:84px}}
@keyframes shim{to{background-position:-200% 0}}

/* cart bar + drawer */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:45;display:none;justify-content:center;
  padding:.8rem max(4vw,env(safe-area-inset-right)) calc(.8rem + env(safe-area-inset-bottom)) max(4vw,env(safe-area-inset-left));
  background:linear-gradient(transparent,rgba(11,18,14,.94) 40%)}
#bar .btn{width:min(560px,100%);justify-content:space-between}
@keyframes land{0%{transform:scale(.62);opacity:.4}55%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.it .add.ok{animation:land .42s var(--ease)}
@keyframes receive{0%{transform:translateY(9px);opacity:0;filter:blur(3px)}
  100%{transform:none;opacity:1;filter:blur(0)}}
#bar.pulse .btn{animation:receive .5s .12s var(--ease) backwards}
@keyframes tick{0%{opacity:0;transform:translateY(5px)}100%{opacity:1;transform:none}}
#barTot.tick{animation:tick .25s var(--ease)}
.overlay{position:fixed;inset:0;z-index:60;background:rgba(6,10,8,.8);backdrop-filter:blur(6px);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .3s var(--ease),visibility 0s linear .3s;
  display:grid;align-items:end;justify-items:center}
.overlay.open{opacity:1;visibility:visible;pointer-events:auto;transition-delay:0s}
.sheet{width:100%;max-width:560px;max-height:88vh;max-height:88svh;overflow:auto;overscroll-behavior:contain;
  background:var(--paper);color:var(--pined);
  border-radius:14px 14px 0 0;padding:1.3rem 1.2rem calc(1.6rem + env(safe-area-inset-bottom));
  box-shadow:var(--sh-sheet);
  transform:translateY(36px);transition:transform .35s var(--ease)}
.overlay.open .sheet{transform:none}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:14px}}
.sheet h2{font-size:var(--t-2);margin-bottom:.8rem}
.mhero{width:calc(100% + 2.4rem);height:auto;margin:-1.3rem -1.2rem .9rem;display:block;aspect-ratio:4/3;

<header class="hdr">
  <a class="hdr-brand" href="./"><img src="assets/logo-mark-cream.svg" alt="" width="30" height="25"></a>
  <b>Laghman Express</b>
  <a class="back" href="./" data-i="back"></a>
  <button class="kbtn" id="kbtn" hidden><span id="kname"></span></button>
  <span class="lang" id="lang"></span>
</header>

<main>
<section id="gate" class="shell">
  <h1 data-i="gateH1">Pick your kitchen.</h1>
  <p class="sub" data-i="gateSub">Each kitchen cooks its own menu with its own prices — today's menu comes straight from the kitchen's register. Hand-pulled laghman noodles in Brooklyn (20th Ave, Coney Island Ave) and Alpharetta, GA.</p>
  <div class="gacts">
    <button class="btn btn-ghost" id="geoBtn" data-i="nearMe"></button>
    <span class="zipw"><input id="zipIn" class="zip" inputmode="numeric" maxlength="5" autocomplete="postal-code"><button class="btn btn-ghost" id="zipGo"></button></span>
  </div>
  <p class="geonote" id="geoNote" aria-live="polite" hidden></p>
  <div id="locWrap"></div>
</section>

<section id="menu" class="shell">
  <div class="mhead">
    <h1 id="mTitle" tabindex="-1"></h1>
    <button type="button" class="sw" id="mSwitch" data-i="switchKitchen"></button>
  </div>
  <p class="mnote" data-i="liveNote"></p>
  <p class="notice" id="hoursNote" aria-live="polite" hidden></p>
  <div class="chips" id="chips"></div>
  <div id="cats"></div>
</section>
</main>

<div id="bar"><button class="btn btn-gold" id="barBtn"><span data-i="cart"></span><span id="barTot"></span></button></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="overlay" id="cartOv" role="dialog" aria-modal="true" aria-labelledby="cartTitle">
  <div class="sheet">
    <button class="xclose" data-x="cartOv"></button>
    <h2 id="cartTitle" data-i="yourOrder"></h2>

    <div id="fulfil" hidden>
      <div class="segs" id="segs" role="group"></div>
      <div id="addrWrap" hidden>
        <div class="addr-field">
          <input id="addrIn" type="text" autocomplete="off" autocapitalize="words"
                 spellcheck="false" enterkeyhint="search" role="combobox"

        <p class="muted" id="addrTerms"></p>
      </div>
    </div>
    <p class="notice" id="cartNotice" aria-live="polite" hidden></p>
    <div class="tot" id="totals" aria-live="polite"></div>
    <p class="muted" id="pickupOnly" data-i="pickupOnly"></p>
    <div id="ckWrap"></div>
    <p class="err" id="cartErr" aria-live="polite"></p>
  </div>
</div>

<div class="overlay" id="modOv" role="dialog" aria-modal="true" aria-labelledby="modName">

    <button class="xclose" data-x="modOv"></button>
    <h2 id="modName"></h2>

</div>

/* the table reads like a meal: dishes first, then drinks and desserts.
   Clover's own sortOrder holds WITHIN each group. */
var LATE=/\b(drinks?|beverages?|sodas?|sparkling|juices?|milkshakes?|lemonades?|smoothies?|coffee|teas?|matcha|ayran|water|desserts?|cakes?)\b|饮|茶|咖啡|果汁|奶昔|柠檬水|甜品|蛋糕/i;
function menuRank(name){return LATE.test(name)?1:0}
function sortCats(list){
 return list.map(function(c,i){return {c:c,i:i}})
  .sort(function(a,b){return menuRank(a.c.name)-menuRank(b.c.name)||a.i-b.i})
  .map(function(x){return x.c});
}
function renderMenu(){
 var cats=sortCats((state.menu.categories||[]).filter(function(c){return c.items&&c.items.length}));
 var chips=$("chips");chips.innerHTML="";
 var wrap=$("cats");wrap.innerHTML="";
 if(chipObserver)chipObserver.disconnect();
 var chipEls=[];
 cats.forEach(function(c,ci){
  var chipText=catText(c.name);
  var chip=el("button","chip"+(ci===0?" on":""),chipText);chip.type="button";
  chip.setAttribute("aria-current",ci===0?"true":"false");
  chip.onclick=function(){var t=document.getElementById("cat-"+ci);if(t)t.scrollIntoView({behavior:SMOOTH,block:"start"})};
  chips.appendChild(chip);chipEls.push(chip);
  var sec=el("div","cat");sec.id="cat-"+ci;sec.setAttribute("data-ci",ci);
  var h=el("h2");h.appendChild(catNode(c.name));sec.appendChild(h);
  var grid=el("div","items");
  c.items.forEach(function(it){
   var d=el("div","it");
   d.appendChild(photoNode(it.id,"th",false));
   var nm=el("span","nm");nm.appendChild(nameNode(it.name));
   if(it.description)nm.appendChild(el("small","desc",dtr(it.description)));
   d.appendChild(nm);
   d.appendChild(el("span","pr",money(it.priceCents)));
   var b=el("button","add");b.type="button";b.appendChild(icon("plus",19));
   var an=splitName(it.name);b.setAttribute("aria-label",T.add+" "+((lang==="zh"&&an.zh)?an.zh:(an.latin||an.zh)));
   b.onclick=function(e){e.stopPropagation();tryAdd(it,b)};
   d.onclick=function(){if(!b.disabled)tryAdd(it,b)};
   d.appendChild(b);grid.appendChild(d);});
  sec.appendChild(grid);wrap.appendChild(sec);});
 /* scroll-spy keeps the active chip honest */
 chipObserver=new IntersectionObserver(function(en){
  en.forEach(function(e){
   if(e.isIntersecting){
    var ci=+e.target.getAttribute("data-ci");
    chipEls.forEach(function(ch,i){ch.className="chip"+(i===ci?" on":"");
     ch.setAttribute("aria-current",i===ci?"true":"false")});
    if(chipEls[ci])chipEls[ci].scrollIntoView({inline:"nearest",block:"nearest"});
   }});
 },{rootMargin:"-120px 0px -65% 0px"});
 wrap.querySelectorAll(".cat").forEach(function(s){chipObserver.observe(s)});
}

/* ---- modifiers ---- */
var modCtx=null;
function tryAdd(it,btn){
 if(btn){btn.disabled=true;btn.innerHTML="";var sp=document.createElement("span");sp.className="spin";btn.appendChild(sp)}
 var setIcon=function(n){if(!btn)return;btn.innerHTML="";btn.appendChild(icon(n,19))};
 var restore=function(){if(btn){btn.disabled=false;setIcon("plus");btn.classList.remove("ok")}};
 var flash=function(){if(btn){btn.disabled=false;setIcon("check");btn.classList.add("ok");
  setTimeout(function(){setIcon("plus");btn.classList.remove("ok")},700)}};
 var s=state.slug; /* a kitchen switch mid-fetch must never add into the new cart */
 var cached=modCache[it.id];
 var p=cached?Promise.resolve(cached)
  :tfetch(API+"/api/menu/"+s+"/items/"+it.id+"/modifiers")
   .then(function(r){
    if(r.status===404)return {groups:[]};
    if(!r.ok)throw 0;
    return r.json()});
 p.then(function(m){
  if(state.slug!==s){restore();return}
  modCache[it.id]=m;
  var groups=(m.groups||[]).filter(function(g){return g.modifiers&&g.modifiers.length});
  if(!groups.length){addLine(it,[],[],it.priceCents);flash();return}
  restore();
  modCtx={item:it,groups:groups,priceMap:{}};openMod();
 }).catch(function(){
  restore();
  if(state.slug===s)toast(T.netErr);
 });
}
var toastTimer=null;
function toast(msg){
 var t=$("toast");t.textContent=msg;t.classList.add("show");
 clearTimeout(toastTimer);
 toastTimer=setTimeout(function(){t.classList.remove("show")},2600);
}

function openMod(){
 var sh=$("modOv").querySelector(".sheet");
 var oldHero=sh.querySelector(".mhero");if(oldHero)oldHero.remove();
 var hero=photoNode(modCtx.item.id,"mhero",true);
 sh.insertBefore(hero,sh.querySelector(".xclose").nextSibling);
 var mn=$("modName");mn.innerHTML="";mn.appendChild(nameNode(modCtx.item.name));
 var md=$("modDesc");md.textContent=dtr(modCtx.item.description||"")||"";md.hidden=!modCtx.item.description;
 mn.appendChild(el("span","mprice"," · "+money(modCtx.item.priceCents||0)));
 var wrap=$("modGroups");wrap.innerHTML="";$("modErr").textContent="";
 modCtx.groups.forEach(function(g,gi){
  var min=g.minRequired||0,max=g.maxAllowed||0;
  var multi=!(max===1);
  var d=el("div","grp");d.id="grp-"+gi;
  var h=el("h3");h.appendChild(nameNode(g.name||T.choose));
  if(min>0)h.appendChild(el("span","req",T.required));
  d.appendChild(h);
  (g.modifiers||[]).forEach(function(mo){
   /* DOM-built: modifier ids/names are API data and must never be
      concatenated into markup (attribute-context XSS) */
   modCtx.priceMap[gi+"|"+mo.id]=mo.priceCents||0;
   var l=el("label","m");
   var inp=document.createElement("input");
   inp.type=multi?"checkbox":"radio";inp.name="g"+gi;inp.value=mo.id;
   if(!multi&&min>=1&&g.modifiers.length===1)inp.checked=true;
   if(!multi&&min===0){ /* optional single-choice: second tap deselects */
    inp.addEventListener("click",function(){
     if(inp._was){inp.checked=false;inp._was=false}
     else{Array.prototype.forEach.call(document.getElementsByName("g"+gi),
       function(o){o._was=false});
      inp._was=true}
     modTotal();
    });
   }
   var sp=document.createElement("span");sp.appendChild(nameNode(mo.name));
   l.appendChild(inp);l.appendChild(sp);
   if(mo.priceCents){l.appendChild(el("span","pr","+"+money(mo.priceCents)))}
   d.appendChild(l);
  });

 });

 openSheet("modOv");

/* ---- cart ---- */
function cartKey(){return "lx_cart_"+state.slug}
function loadCart(){
 try{
  var c=JSON.parse(localStorage.getItem(cartKey())||"[]");
  if(!Array.isArray(c))return [];
  return c.filter(function(l){return l&&typeof l.itemId==="string"&&typeof l.name==="string"})
   .map(function(l){
    l.quantity=Math.max(1,Math.min(20,parseInt(l.quantity,10)||1));
    if(!Array.isArray(l.modifierIds))l.modifierIds=[];
    l.modifierIds=l.modifierIds.filter(function(x){return typeof x==="string"});
    if(!Array.isArray(l.mods))l.mods=[];
    if(typeof l.key!=="string")l.key=l.itemId+"|"+l.modifierIds.slice().sort().join(",");
    if(typeof l.unitCents!=="number")delete l.unitCents;
    return l;});
 }catch(e){return []}
}
function saveCart(){try{localStorage.setItem(cartKey(),JSON.stringify(state.cart))}catch(e){}}
/* a cart edit invalidates both the stale notice and the bar's remembered total */
function hideStaleNotice(){$("cartNotice").hidden=true;lastTotal=null}
function addLine(it,modIds,modNames,unitCents){
 var key=it.id+"|"+modIds.slice().sort().join(",");
 var ln=null;for(var i=0;i<state.cart.length;i++)if(state.cart[i].key===key)ln=state.cart[i];
 if(ln){ln.quantity=Math.min(20,ln.quantity+1)}
 else state.cart.push({key:key,itemId:it.id,name:it.name,mods:modNames,modifierIds:modIds,quantity:1,
  unitCents:(typeof unitCents==="number"?unitCents:it.priceCents)});
 hideStaleNotice();saveCart();updateBar(true);requestQuote();
}
function cartCount(){var n=0;state.cart.forEach(function(l){n+=l.quantity});return n}
function updateBar(pulse){
 var n=cartCount();
 $("bar").style.display=state.slug&&n>0?"flex":"none";
 var bt=$("barTot");
 /* keep the last known total while a fresh quote is in flight — the pay
    button is the guarded control, the bar is informational */
 var txt=state.quote?money(state.quote.totalCents)
  :(state.quoteBusy&&lastTotal!=null?money(lastTotal):countLabel(n));
 if(bt.textContent!==txt){bt.textContent=txt;
  bt.classList.remove("tick");void bt.offsetWidth;bt.classList.add("tick")}
 if(pulse){var b=$("bar");b.classList.remove("pulse");void b.offsetWidth;b.classList.add("pulse")}
}
$("barBtn").onclick=function(){renderCart();openSheet("cartOv");if(!state.cfg)fetchCfg()};

/* sheet helpers: iOS-safe scroll lock + focus trap + restore + Esc */
var lockY=0,lastFocus=null;
function lockBody(){
 if(document.body.classList.contains("locked"))return;
 lockY=window.scrollY||window.pageYOffset||0;
 document.body.style.top=-lockY+"px";
 document.body.classList.add("locked");
 document.querySelectorAll("header.hdr,main,#bar").forEach(function(n){try{n.inert=true}catch(e){}});
}
function unlockBody(){
 if(document.querySelector(".overlay.open"))return;
 if(!document.body.classList.contains("locked"))return; /* never restore a stale lockY */
 document.body.classList.remove("locked");
 document.body.style.top="";
 document.querySelectorAll("header.hdr,main,#bar").forEach(function(n){try{n.inert=false}catch(e){}});
 window.scrollTo(0,lockY);
}
function openSheet(id){
 lastFocus=document.activeElement;
 $(id).classList.add("open");lockBody();
 var x=$(id).querySelector(".xclose");if(x)x.focus();
}
function closeSheet(id){
 $(id).classList.remove("open");unlockBody();
 if(!document.querySelector(".overlay.open")&&lastFocus&&lastFocus.focus){
  try{lastFocus.focus()}catch(e){}lastFocus=null}
}
document.querySelectorAll(".xclose").forEach(function(b){
 b.onclick=function(){closeSheet(b.getAttribute("data-x"))}});
["cartOv","modOv"].forEach(function(id){
 $(id).addEventListener("click",function(e){if(e.target===this)closeSheet(id)});});
document.addEventListener("keydown",function(e){
 var open=document.querySelectorAll(".overlay.open");
 if(!open.length)return;
 var top=open[open.length-1];
 if(e.key==="Escape"){closeSheet(top.id);return}
 if(e.key!=="Tab")return;
 /* keep focus inside the topmost sheet */
 var f=Array.prototype.filter.call(
  top.querySelectorAll('button,a[href],input,select,textarea,[tabindex]:not([tabindex="-1"])'),
  function(n){return !n.disabled&&n.offsetParent!==null});
 if(!f.length)return;
 var first=f[0],last=f[f.length-1];
 if(e.shiftKey&&(document.activeElement===first||!top.contains(document.activeElement))){
  e.preventDefault();last.focus()}
 else if(!e.shiftKey&&(document.activeElement===last||!top.contains(document.activeElement))){
  e.preventDefault();first.focus()}
});

 if(state.quoteBusy||(!state.quote&&!state.quoteErr)){

   drawTotals(lastQuote,true);

   syncPayBtn();return}

 drawTotals(state.quote,false);

 t.scrollIntoView({block:"center",behavior:SMOOTH})}

/* ---------- pickup or delivery ---------- */
/* the customer asked for delivery */
function deliveryChosen(){return state.mode==="delivery"&&!!DELIVERS[state.slug]}
/* ...and gave us enough address to price it */
function deliveryOn(){return deliveryChosen()&&state.addr.length>7}
function renderFulfil(){
 var wrap=$("fulfil"),segs=$("segs"),aw=$("addrWrap"),ai=$("addrIn"),note=$("addrNote");
 if(!wrap)return;
 /* the choice only exists where a driver does */
 if(!DELIVERS[state.slug]){wrap.hidden=true;state.mode="pickup";return}
 wrap.hidden=!state.cart.length;
 segs.innerHTML="";
 [["pickup",T.pickupTab],["delivery",T.deliveryTab]].forEach(function(p){
  var b=el("button",state.mode===p[0]?"on":null,p[1]);b.type="button";
  b.setAttribute("aria-pressed",state.mode===p[0]?"true":"false");
  b.onclick=function(){
   if(state.mode===p[0])return;
   state.mode=p[0];state.addrErr="";
   try{localStorage.setItem("lx_mode",state.mode)}catch(e){}
   renderFulfil();requestQuote(true);
  };
  segs.appendChild(b);
 });
 aw.hidden=state.mode!=="delivery";
 ai.placeholder=T.addrPh;
 ai.setAttribute("aria-label",T.addrPh);
 if(document.activeElement!==ai)ai.value=state.addr;
 note.className="muted"+(state.addrErr?" bad":"");
 note.textContent=state.addrErr
  ||(state.quote&&state.quote.delivery
     ? T.deliverTo+": "+state.quote.delivery.address+" · "+state.quote.delivery.miles+" "+T.milesAway
     : T.addrHint);
 /* the terms up front: what it takes and how far, before they type anything */
 var terms=$("addrTerms"),d=DELIVERS[state.slug];
 if(terms&&d){
  var parts=[T.freeWithin.replace("{m}",d.freeMiles),T.fromAmount.replace("{x}",money(d.min))];
  if(d.maxMiles>d.freeMiles)parts.push(T.thenFee.replace("{x}",money(d.feeCents)).replace("{m}",d.maxMiles));
  terms.textContent=parts.join(" · ");
  /* how much more food gets them over the line */
  var sub=state.quote?state.quote.subtotalCents:cartSubtotal();
  if(sub>0&&sub<d.min&&!state.addrErr)
   terms.textContent=T.minShort.replace("{x}",money(d.min-sub))+" "+terms.textContent;
 } else if(terms) terms.textContent="";
}
/* the cart's own arithmetic, for the moments before a quote exists */
function cartSubtotal(){
 return state.cart.reduce(function(sum,l){return sum+(l.unitCents||0)*l.quantity},0);
}
var addrTimer=null,sugTimer=null,sugSeq=0,sugItems=[],sugIdx=-1;
/* the last numbers we showed, kept so a re-check does not blank the panel
   the customer is reading — the pay button stays the guarded control */
var lastQuote=null;
function closeSug(){
 var l=$("addrList");if(!l)return;
 l.hidden=true;l.innerHTML="";sugItems=[];sugIdx=-1;
 var ai=$("addrIn");if(ai)ai.setAttribute("aria-expanded","false");
}
function renderSug(){
 var l=$("addrList"),ai=$("addrIn");if(!l||!ai)return;
 if(!sugItems.length){closeSug();return}
 l.innerHTML="";
 sugItems.forEach(function(sug,i){
  var li=el("li",null,null);
  li.setAttribute("role","option");
  li.setAttribute("aria-selected",i===sugIdx?"true":"false");
  /* show what they typed in bold so the eye lands on the difference */
  var typed=ai.value.trim().toLowerCase();
  var at=sug.label.toLowerCase().indexOf(typed);
  if(typed&&at===0){
   li.appendChild(el("b",null,sug.label.slice(0,typed.length)));
   li.appendChild(document.createTextNode(sug.label.slice(typed.length)));
  } else li.appendChild(document.createTextNode(sug.label));
  /* mousedown, not click: blur would close the list first */
  li.addEventListener("mousedown",function(e){e.preventDefault();chooseSug(i)});
  l.appendChild(li);
 });
 l.hidden=false;ai.setAttribute("aria-expanded","true");
}
function chooseSug(i){
 var sug=sugItems[i];if(!sug)return;
 var ai=$("addrIn");
 ai.value=sug.label;state.addr=sug.label;state.addrErr="";
 try{localStorage.setItem("lx_addr",state.addr)}catch(e){}
 closeSug();clearTimeout(addrTimer);requestQuote(true);
}
function askSug(q){
 var seq=++sugSeq;
 tfetch(API+"/api/delivery/suggest",{method:"POST",
  headers:{"Content-Type":"application/json"},body:JSON.stringify({q:q})})
 .then(function(r){return r.json()})
 .then(function(j){
  if(seq!==sugSeq)return;              /* a later keystroke already won */
  /* the field still has to hold what we asked about — focus is not a
     reliable test on phones, but the text is */
  var ai=$("addrIn");
  if(!ai||ai.value.trim()!==q)return;
  sugItems=(j&&j.suggestions)||[];sugIdx=-1;renderSug();
 })
 .catch(function(){if(seq===sugSeq)closeSug()});
}
function bindAddress(){
 var ai=$("addrIn");if(!ai)return;
 ai.addEventListener("input",function(){
  state.addr=ai.value.trim();state.addrErr="";
  try{localStorage.setItem("lx_addr",state.addr)}catch(e){}
  /* the quote in hand was priced for the address that was there a moment ago;
     the moment they change it, it must stop being payable — the debounce
     below would otherwise leave a second where Pay charges the old address */
  if(state.quote&&state.quote.delivery){
   state.quote=null;state.idem=null;++quoteSeq;
   state.quoteBusy=true;renderTotals();updateBar();
  }
  clearTimeout(addrTimer);clearTimeout(sugTimer);
  if(state.addr.length<3){closeSug();return}
  /* suggestions come quickly, the quote waits for them to stop typing */
  sugTimer=setTimeout(function(){askSug(state.addr)},220);
  addrTimer=setTimeout(function(){requestQuote(true)},900);
 });
 ai.addEventListener("keydown",function(e){
  var open=sugItems.length&&!$("addrList").hidden;
  if(e.key==="ArrowDown"&&open){e.preventDefault();sugIdx=(sugIdx+1)%sugItems.length;renderSug();return}
  if(e.key==="ArrowUp"&&open){e.preventDefault();sugIdx=(sugIdx-1+sugItems.length)%sugItems.length;renderSug();return}
  if(e.key==="Escape"&&open){e.preventDefault();closeSug();return}
  if(e.key==="Enter"){
   e.preventDefault();
   if(open&&sugIdx>=0){chooseSug(sugIdx);return}
   closeSug();ai.blur();clearTimeout(addrTimer);requestQuote(true);
  }
 });
 ai.addEventListener("blur",function(){setTimeout(closeSug,120)});
}
/* the server names exactly why it will not deliver; say it in their language */
function deliveryProblem(j){
 if(!j)return "";
 if(j.code==="BELOW_MINIMUM")return T.minShort.replace("{x}",money(j.shortCents||0));
 if(j.code==="OUT_OF_RANGE")return T.tooFar;
 if(j.code==="ADDRESS_NOT_FOUND"||j.code==="ADDRESS_TOO_SHORT")return T.addrBad;
 if(j.code==="GEOCODER_UNAVAILABLE")return T.addrSlow;
 if(j.code==="DELIVERY_NOT_OFFERED")return T.noDeliveryHere;
 return "";
}

function requestQuote(now){
 if(!state.cart.length){state.quote=null;lastQuote=null;state.idem=null;state.quoteErr=false;renderTotals();updateBar();return}
 /* invalidate immediately: nothing may pay against a stale quote */
 /* Delivery chosen but no usable address yet: quoting this as pickup would
    hand them a payable pickup order while the page still says Delivery —
    they would pay, and nobody would drive. Refuse to quote instead. */
 if(deliveryChosen()&&!deliveryOn()){
  state.quote=null;lastQuote=null;state.idem=null;state.quoteBusy=false;state.quoteErr=false;
  state.deliveryBlocked=T.addrNeeded;state.addrErr="";
  clearTimeout(quoteTimer);++quoteSeq;
  renderFulfil();renderTotals();updateBar();return;
 }
 state.quote=null;state.idem=null;state.quoteBusy=true;state.quoteErr=false;state.deliveryBlocked="";
 renderTotals();updateBar();
 clearTimeout(quoteTimer);
 var seq=++quoteSeq;
 quoteTimer=setTimeout(function(){
  tfetch(API+"/api/quotes",{method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({locationSlug:state.slug,fulfillment:deliveryOn()?"delivery":"pickup",
    deliveryAddress:deliveryOn()?state.addr:undefined,
    cart:state.cart.map(function(l){return{itemId:l.itemId,quantity:l.quantity,modifierIds:l.modifierIds}})})})
  .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})})
  .then(function(res){
   if(seq!==quoteSeq)return;
   state.quoteBusy=false;
   if(res.ok){state.quote=res.j;lastTotal=res.j.totalCents;lastQuote=res.j;state.quoteFails=0;
    state.addrErr="";state.deliveryBlocked="";$("cartErr").textContent="";renderFulfil()}
   else{
    /* the kitchen pulled a dish or one of its options: the cart can never be
       quoted again, and it is saved — without dropping that line the customer
       is locked out for good, told only "connection hiccup" */
    var gone=res.j&&res.j.itemId&&/ITEM_UNAVAILABLE|MODIFIER_UNAVAILABLE|MODIFIER_REQUIRED|TOO_MANY_MODIFIERS/.test(res.j.code||"");
    if(gone){
     var before=state.cart.length;
     state.cart=state.cart.filter(function(l){return l.itemId!==res.j.itemId});
     if(state.cart.length<before){
      saveCart();state.quoteErr=false;state.quoteBusy=false;state.quote=null;lastQuote=null;
      var nl=$("cartNotice");nl.textContent=T.lineGone;nl.hidden=false;
      $("cartErr").textContent="";
      renderCart();updateBar();requestQuote(true);return;
     }
    }
    var dp=deliveryProblem(res.j);
    if(dp){
     /* not a broken cart — a delivery the kitchen will not make yet */
     state.quoteErr=false;state.quoteBusy=false;state.quote=null;
     state.deliveryBlocked=dp;
     state.addrErr=dp;$("cartErr").textContent="";
     renderFulfil();renderTotals();updateBar();return;
    }
    state.quoteErr=true;state.quoteFails++;
    /* an item may have left today's menu — refresh menu + prune, then the
       user can retry against the pruned cart */
    if(state.quoteFails===1&&state.menu){
     tfetch(API+"/api/menu/"+state.slug).then(function(r){return r.ok?r.json():null})
     .then(function(m){if(m&&seq===quoteSeq){state.menu=m;renderMenu();pruneCart();renderCart()}});
    }
    /* server error strings are English — show localized copy instead */
    $("cartErr").textContent=(res.j&&res.j.code==="MENU_UNAVAILABLE")?T.menuFail:T.netErr;
   }
   renderTotals();updateBar();})
  .catch(function(){
   if(seq!==quoteSeq)return;
   state.quoteBusy=false;state.quoteErr=true;state.quoteFails++;
   renderTotals();updateBar();});
 },now?0:450);
}

/* ---- checkout ---- */
function fetchCfg(){
 var s=state.slug;if(!s)return;
 tfetch(API+"/api/checkout/config/"+s)
 .then(function(r){if(!r.ok)throw 0;return r.json()})
 .then(function(c){if(state.slug!==s)return;state.cfg=c;renderCheckout()})
 .catch(function(){if(state.slug!==s)return;
  cfgFails++;
  if(cfgFails>=3){ckMode=null;renderCheckout();return}
  setTimeout(function(){if(state.slug===s&&!state.cfg)fetchCfg()},4000)});
}
function hostedActive(){return state.cfg&&state.cfg.paymentsEnabled&&state.cfg.checkoutMode==="hosted_checkout"}
var ckMode=null,cfgFails=0; /* build the form once; rebuilding on every qty tap would wipe typed input */
function renderCheckout(){
 var w=$("ckWrap");
 function parkErr(){var e=document.getElementById("cartErr");
  if(e&&e.parentNode!==w.parentNode)w.parentNode.appendChild(e)}
 if(!state.cart.length){parkErr();w.innerHTML="";ckMode=null;return}
 if(!state.cfg&&cfgFails<3){ /* still loading — never flash the call-us fallback */
  if(ckMode!=="wait"){ckMode="wait";parkErr();w.innerHTML="";
   w.appendChild(el("p","muted",T.loading))}
  return}
 var mode=hostedActive()?"pay":"call";
 if(ckMode===mode){syncPayBtn();return}
 /* rebuilding must not lose what the user already typed (e.g. language switch) */
 var typed={};["cN","cP","cE"].forEach(function(id){var n=$(id);if(n)typed[id]=n.value});
 ckMode=mode;parkErr();w.innerHTML="";
 var k=kitchen();
 if(mode==="pay"){
  var saved={};try{saved=JSON.parse(localStorage.getItem("lx_customer")||"{}")||{}}catch(e){}
  [["cN","name","name"],["cP","phone","tel"],["cE","email","email"]].forEach(function(f){
   var lab=el("label",null,T[f[1]]);lab.htmlFor=f[0];w.appendChild(lab);
   var inp=document.createElement("input");
   inp.id=f[0];inp.autocomplete=f[2];
   if(f[0]==="cP"){inp.inputMode="tel";inp.enterKeyHint="next"}
   else if(f[0]==="cE"){inp.inputMode="email";inp.enterKeyHint="go"}
   else inp.enterKeyHint="next";
   if(typed.hasOwnProperty(f[0]))inp.value=typed[f[0]];
   else if(saved[f[1]])inp.value=saved[f[1]];
   inp.addEventListener("input",function(){state.idem=null;if(inp._err)validateField(f[0])});
   inp.addEventListener("blur",function(){if(inp.value)validateField(f[0])});
   inp.addEventListener("focus",function(){setTimeout(function(){inp.scrollIntoView({block:"center"})},250)});
   inp.addEventListener("keydown",function(e){if(e.key==="Enter"){
    if(f[0]==="cE")startHosted();else{var nx=$(f[0]==="cN"?"cP":"cE");nx&&nx.focus()}}});
   w.appendChild(inp);
   var fe=el("small","ferr","");fe.id=f[0]+"err";w.appendChild(fe);
  });
  /* a delivery customer is not picking anything up — show where it goes */
  if(state.quote&&state.quote.delivery){
   w.appendChild(el("p","pickup-where",lbl(T.deliverTo+":",state.quote.delivery.address)));
  } else if(k){
   w.appendChild(el("p","pickup-where",lbl(T.pickupAtLbl,k.name+" · "+k.addr)));
  }
  var re=el("p","reassure");re.appendChild(icon("lock",17));
  re.appendChild(el("span",null,T.payNote));w.appendChild(re);
  /* the primary action rides a sticky footer — never below the fold */
  var foot=el("div","ckfoot");
  var btn=el("button","btn btn-gold");btn.id="payBtn";btn.type="button";btn.onclick=startHosted;
  foot.appendChild(btn);foot.appendChild($("cartErr"));w.appendChild(foot);
  syncPayBtn();
 }else{
  var box=el("div","note-call");
  box.appendChild(document.createTextNode(T.notActive));
  box.appendChild(document.createElement("br"));box.appendChild(document.createElement("br"));
  if(k&&k.tel){var a=el("a","btn btn-gold",T.call+" · "+k.phone);a.href="tel:"+k.tel;box.appendChild(a)}
  w.appendChild(box);
 }
}
function syncPayBtn(){
 var btn=$("payBtn");if(!btn||btn._busy)return;
 if(state.quoteErr&&!state.quoteBusy){btn.disabled=true;btn.textContent=T.quoteFail;return}
 if(state.quoteBusy||!state.quote){btn.disabled=true;btn.textContent=T.quoteWait}
 else{btn.disabled=false;btn.textContent=T.payOnline+" · "+money(state.quote.totalCents)}
}
function validateField(id){
 var inp=$(id);if(!inp)return true;
 var v=inp.value.trim(),ok=true,msg="";
 if(id==="cN"){ok=v.length>=2;msg=T.fName}
 if(id==="cP"){ok=v.replace(/\D/g,"").length>=7;msg=T.fPhone}
 if(id==="cE"){ok=/.@./.test(v);msg=T.fEmail}
 inp._err=!ok;
 inp.classList.toggle("bad",!ok);
 var fe=$(id+"err");if(fe)fe.textContent=ok?"":msg;
 return ok;
}
function startHosted(){
 var pb=$("payBtn");if(pb&&pb._busy)return; /* Enter-key path bypasses the disabled button */
 var okN=validateField("cN"),okP=validateField("cP"),okE=validateField("cE");
 if(!okN){$("cN").focus();return}
 if(!okP){$("cP").focus();return}
 if(!okE){$("cE").focus();return}
 if(state.quoteBusy||!state.quote){$("cartErr").textContent=T.quoteWait;requestQuote(true);return}
 /* quotes live 10 min — never pay against one about to die */
 var exp=state.quote.expiresAt?Date.parse(state.quote.expiresAt):0;
 if(exp&&exp-Date.now()<30000){requestQuote(true);return}
 if(!state.idem)state.idem=uuid4();
 var n=$("cN").value.trim(),p=$("cP").value.trim(),e=$("cE").value.trim();
 var btn=$("payBtn");btn._busy=true;btn.disabled=true;
 btn.innerHTML='<span class="spin"></span> '+money(state.quote.totalCents);
 var unbusy=function(){btn._busy=false;syncPayBtn()};
 var sentQuote=state.quote; /* a cart edit mid-flight voids this session */
 tfetch(API+"/api/hosted-checkout/sessions",{method:"POST",
  headers:{"Content-Type":"application/json","Idempotency-Key":state.idem},
  body:JSON.stringify({quoteId:state.quote.quoteId,menuVersion:state.quote.menuVersion,
   expectedTotalCents:state.quote.totalCents,customer:{name:n,phone:p,email:e}})})
 .then(function(r){return r.json().then(function(j){return{s:r.status,j:j}})})
 .then(function(res){
  /* a repeated submit with the same key answers 200 with the session already
     created — treating only 201 as success left the customer staring at an
     error while a perfectly good payment page was in the reply */
  var madeSession=(res.s===201||res.s===200)&&res.j.href;
  if(madeSession&&state.quote!==sentQuote){
   /* the cart changed while the session was being created — never redirect
      to a checkout priced from the old cart */
   unbusy();state.idem=null;requestQuote(true);return}
  if(madeSession){
   try{localStorage.setItem("lx_customer",JSON.stringify({name:n,phone:p,email:e}));
    /* order-status uses this to clear ONLY the paid kitchen's cart + show a summary */
    localStorage.setItem("lx_pay_slug",state.slug)}catch(x){}
   /* cart is NOT cleared here — order-status clears it on confirmed payment,
      so backing out of Clover keeps the order intact */
   location.href=res.j.href;return}
  unbusy();
  if(res.j&&res.j.code==="PRICE_CHANGED"){state.idem=null;
   $("cartErr").textContent="";
   var nl=$("cartNotice");nl.textContent=T.priceChanged;nl.hidden=false;
   requestQuote(true);flashTotals();return}
  if(res.j&&res.j.code==="VALIDATION"&&res.j.field){
   /* the server says which input it refused — mark that one instead of
      telling them "something went wrong" on every further press */
   var fid={"customer.email":"cE","customer.phone":"cP","customer.name":"cN"}[res.j.field];
   state.idem=null;
   if(fid){
    var fe=$(fid+"err");if(fe)fe.textContent=T.fixField||T.netErr;
    var fi=$(fid);if(fi){fi._err=true;fi.focus()}
    $("cartErr").textContent="";
   } else $("cartErr").textContent=T.netErr;
   return}
  if(res.j&&res.j.code==="CART_TOO_LARGE"){
   $("cartErr").textContent=T.cartTooBig;return}
  if(res.j&&res.j.code==="CHECKOUT_SESSION_FAILED"){
   /* that attempt is finished for good — a fresh key or the button just
      re-lands on the same dead attempt */
   state.idem=null;$("cartErr").textContent=T.payFailed;return}
  if(res.j&&res.j.code==="HOSTED_CHECKOUT_NOT_ACTIVE"){
   $("cartErr").textContent=T.notActive;
   state.cfg=null;ckMode=null;fetchCfg();return}
  $("cartErr").textContent=(res.j&&res.j.code==="MENU_UNAVAILABLE")?T.menuFail:T.netErr;})
 .catch(function(){unbusy();$("cartErr").textContent=T.netErr});
}
/* bfcache return from Clover: reset the button, key, quote AND the sheet UI —
   after a successful payment order-status has emptied the stored cart, so the
   open cart sheet must not keep stale lines or a frozen spinner button */
window.addEventListener("pageshow",function(e){
 if(!e.persisted)return;
 var b=$("payBtn");if(b)b._busy=false;
 state.idem=null;
 if(!state.slug)return;
 state.cart=loadCart();
 renderCart();updateBar();
 if(state.cart.length){requestQuote(true)}
 else{state.quote=null;lastTotal=null;
  if($("cartOv").classList.contains("open"))closeSheet("cartOv")}
});

/* ---- boot ---- */
function setHdrVar(){var hd=document.querySelector(".hdr");
 if(hd)document.documentElement.style.setProperty("--hdrh",Math.round(hd.getBoundingClientRect().height)+"px")}
window.addEventListener("resize",setHdrVar);setHdrVar();
applyLang();renderGate();setHdrVar();
/* the address field is static markup, so one binding at boot serves every
   time the cart is opened */
bindAddress();
var saved=null;try{saved=localStorage.getItem("lx_kitchen")}catch(e){}
var qk=new URLSearchParams(location.search).get("k");
function orderable(slug){for(var i=0;i<KITCHENS.length;i++)if(KITCHENS[i].slug===slug&&KITCHENS[i].api)return KITCHENS[i];return null}
/* a stale/invalid ?k must not demote a returning customer's saved kitchen */
if(qk&&orderable(qk))saved=qk;
/* ?k= is an entry hint, not a pin: drop it so a manual switch survives reload */
if(qk&&history.replaceState){try{history.replaceState(null,"",location.pathname)}catch(e){}}
var savedK=saved?orderable(saved):null;
if(savedK){pickKitchen(savedK.slug)}
else if(navigator.permissions&&navigator.permissions.query){
 navigator.permissions.query({name:"geolocation"}).then(function(st){
  if(st.state==="granted")$("geoBtn").click();}).catch(function(){});
}
})();
</script>
