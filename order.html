<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Order — Laghman Express</title>
<meta name="description" content="Order pickup from Laghman Express — live menu and prices from each kitchen.">
<link rel="icon" href="assets/logo-symbol.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Instrument+Sans:wght@400;600&family=Playfair+Display:wght@600&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet">
<style>
/* Laghman Express /order — standalone page, same design tokens as the site.
   Talks to the live ordering API; prices are server-authoritative. */
:root{
  --ink:#0b120e; --ink2:#111b14; --pine:#16301f; --pined:#0f2417;
  --paper:#f7f2e6; --paper2:#efe7d5; --cream:#f6f1e4;
  --cream60:rgba(246,241,228,.62); --cream40:rgba(246,241,228,.4);
  --gold:#e0b25c; --golds:#f0d49a; --goldi:#8a6420; --ember:#e2612b;
  --ease:cubic-bezier(.19,1,.22,1);
  --display:"Fraunces","Playfair Display","Noto Serif SC",Georgia,serif;
  --sans:"Instrument Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--cream);font-family:var(--sans);line-height:1.55;padding-bottom:88px}
:lang(zh-CN) h1,:lang(zh-CN) h2,:lang(zh-CN) h3{letter-spacing:0;line-height:1.16}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.02em;margin:0;line-height:1.02}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.shell{width:min(1100px,92vw);margin-inline:auto}
.eyebrow{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}

.hdr{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:.8rem;padding:.7rem 4vw;
  background:rgba(11,18,14,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(224,178,92,.2)}
.hdr img{width:30px;height:30px;object-fit:contain}
.hdr b{font-family:var(--display);font-size:1rem}
.hdr .back{color:var(--cream60);font-size:.85rem;margin-right:auto}
.hdr .back:hover{color:var(--cream)}
.lang{display:inline-flex;gap:2px;border:1px solid rgba(246,241,228,.28);border-radius:100px;padding:2px}
.lang button{padding:.22rem .55rem;border-radius:100px;font-size:.72rem;font-weight:700;color:var(--cream60)}
.lang button.on{background:var(--gold);color:#22160a}
.kbtn{display:inline-flex;align-items:center;gap:.45rem;border:1px solid rgba(224,178,92,.4);border-radius:100px;
  padding:.35rem .8rem;font-size:.8rem;color:var(--golds)}
.kbtn:hover{border-color:var(--gold)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.85rem 1.5rem;border-radius:100px;
  font-weight:600;font-size:.95rem;transition:transform .4s var(--ease),background .3s var(--ease)}
.btn-gold{background:var(--gold);color:#22160a}
.btn-gold:hover{background:var(--golds)}
.btn-gold:disabled{opacity:.45;cursor:default}
.btn-ghost{border:1px solid rgba(246,241,228,.3)}
.btn-ghost:hover{border-color:var(--cream)}

/* gate */
#gate{padding:2.4rem 0 3rem}
#gate h1{font-size:clamp(1.9rem,5.5vw,3rem);max-width:22ch}
#gate .sub{color:var(--cream60);margin:.7rem 0 1.4rem;max-width:52ch}
.gacts{display:flex;flex-wrap:wrap;gap:.7rem;margin-bottom:1.6rem}
.locs{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.loc{position:relative;text-align:left;border:1px solid rgba(246,241,228,.16);border-radius:10px;padding:1.1rem 1.1rem 1.2rem;
  background:var(--ink2);transition:border-color .4s var(--ease),transform .4s var(--ease)}
.loc:hover{border-color:rgba(224,178,92,.5);transform:translateY(-3px)}
.loc h3{font-size:1.25rem;margin:.15rem 0 .3rem}
.loc .area{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.loc .addr{color:var(--cream60);font-size:.88rem;line-height:1.45}
.loc .dist{position:absolute;top:.9rem;right:1rem;font-size:.8rem;color:var(--golds)}
.loc .tag{display:inline-block;margin-top:.6rem;font-size:.72rem;padding:.25rem .6rem;border-radius:100px;
  border:1px solid rgba(224,178,92,.35);color:var(--golds)}
.loc.phone .tag{border-color:rgba(246,241,228,.25);color:var(--cream60)}
.loc.nearest{border-color:var(--gold)}

/* menu */
#menu{display:none;padding:1.4rem 0 2rem}
.mhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:.6rem 1rem;margin-bottom:.4rem}
.mhead h1{font-size:clamp(1.5rem,4.2vw,2.2rem)}
.mhead .sw{font-size:.8rem;color:var(--cream60);text-decoration:underline;cursor:pointer}
.mnote{color:var(--cream60);font-size:.85rem;margin:.2rem 0 1rem}
.chips{position:sticky;top:52px;z-index:30;display:flex;gap:.5rem;overflow-x:auto;padding:.7rem 0;
  background:linear-gradient(var(--ink) 82%,transparent);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:.45rem .95rem;border-radius:100px;border:1px solid rgba(246,241,228,.2);
  font-size:.85rem;color:var(--cream60);white-space:nowrap}
.chip.on{background:var(--paper);color:var(--pined);border-color:var(--paper);font-weight:600}
.cat{margin:1.6rem 0 .4rem}
.cat h2{font-size:1.3rem;color:var(--golds)}
.items{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));margin-top:.7rem}
.it{display:flex;align-items:center;gap:.9rem;border:1px solid rgba(246,241,228,.12);border-radius:9px;
  padding:.8rem .95rem;background:var(--ink2)}
.it .nm{flex:1;font-size:.95rem;line-height:1.35}
.it .pr{color:var(--golds);font-weight:600;white-space:nowrap}
.it .add{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#22160a;font-size:1.15rem;
  font-weight:700;display:grid;place-items:center;transition:background .3s var(--ease)}
.it .add:hover{background:var(--golds)}
.skel{color:var(--cream40);padding:2rem 0;text-align:center}

/* cart bar + drawer */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:45;display:none;justify-content:center;padding:.8rem 4vw;
  background:linear-gradient(transparent,rgba(11,18,14,.94) 40%)}
#bar .btn{width:min(560px,100%);justify-content:space-between}
.overlay{position:fixed;inset:0;z-index:60;background:rgba(6,10,8,.8);backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .3s var(--ease);display:grid;align-items:end;justify-items:center}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:560px;max-height:88svh;overflow:auto;background:var(--paper);color:var(--pined);
  border-radius:14px 14px 0 0;padding:1.3rem 1.2rem 1.6rem;transform:translateY(24px);transition:transform .35s var(--ease)}
.overlay.open .sheet{transform:none}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:14px}}
.sheet h2{font-size:1.5rem;margin-bottom:.7rem}
.line{display:flex;align-items:center;gap:.7rem;padding:.55rem 0;border-bottom:1px solid rgba(15,36,23,.1)}
.line .nm{flex:1;font-size:.92rem;line-height:1.3}
.line .nm small{display:block;color:rgba(15,36,23,.6);font-size:.78rem}
.qty{display:inline-flex;align-items:center;gap:.55rem}
.qty button{width:26px;height:26px;border-radius:50%;border:1px solid rgba(15,36,23,.3);display:grid;place-items:center;font-weight:700}
.qty b{min-width:1.2ch;text-align:center}
.tot{display:grid;gap:.25rem;margin:1rem 0;font-size:.95rem}
.tot div{display:flex;justify-content:space-between}
.tot .g{font-weight:700;font-size:1.1rem}
.muted{color:rgba(15,36,23,.62);font-size:.8rem}
.sheet .btn-gold{width:100%;margin-top:.6rem}
.sheet label{display:block;font-size:.8rem;font-weight:600;margin:.7rem 0 .25rem;color:rgba(15,36,23,.8)}
.sheet input{width:100%;padding:.7rem .8rem;border:1px solid rgba(15,36,23,.25);border-radius:8px;font:inherit;background:#fff}
.err{color:#8a2b12;font-size:.85rem;margin-top:.6rem;min-height:1.2em}
.ok{background:#eef7ee;border:1px solid #bfe0bf;border-radius:8px;padding:.8rem;font-size:.9rem;margin-top:.6rem}
.xclose{position:sticky;top:0;float:right;font-size:1.1rem;opacity:.6;padding:.2rem .4rem}
/* modifier modal reuses .overlay/.sheet */
.grp{margin:.8rem 0}
.grp h3{font-size:1.02rem;margin-bottom:.35rem}
.grp .m{display:flex;align-items:center;gap:.6rem;padding:.4rem 0;font-size:.92rem}
.grp .m .pr{margin-left:auto;color:var(--goldi);font-weight:600}
.note-call{border:1px solid rgba(15,36,23,.2);border-radius:10px;padding:.9rem;margin-top:.8rem;font-size:.9rem}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(34,22,10,.4);border-top-color:#22160a;
  border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header class="hdr">
  <a class="hdr-brand" href="./"><img src="assets/logo-symbol.png" alt=""></a>
  <b>Laghman Express</b>
  <a class="back" href="./" data-i="back"></a>
  <button class="kbtn" id="kbtn" hidden><span id="kname"></span> ↺</button>
  <span class="lang" id="lang"></span>
</header>

<section id="gate" class="shell">
  <p class="eyebrow" data-i="gateEyebrow"></p>
  <h1 data-i="gateH1"></h1>
  <p class="sub" data-i="gateSub"></p>
  <div class="gacts">
    <button class="btn btn-gold" id="geoBtn" data-i="nearMe"></button>
  </div>
  <div class="locs" id="locCards"></div>
</section>

<section id="menu" class="shell">
  <div class="mhead">
    <h1 id="mTitle"></h1>
    <span class="sw" id="mSwitch" data-i="switchKitchen"></span>
  </div>
  <p class="mnote" data-i="liveNote"></p>
  <div class="chips" id="chips"></div>
  <div id="cats"><div class="skel" data-i="loading"></div></div>
</section>

<div id="bar"><button class="btn btn-gold" id="barBtn"><span data-i="cart"></span><span id="barTot"></span></button></div>

<div class="overlay" id="cartOv" role="dialog" aria-modal="true">
  <div class="sheet">
    <button class="xclose" data-x="cartOv">✕</button>
    <h2 data-i="yourOrder"></h2>
    <div id="lines"></div>
    <div class="tot" id="totals"></div>
    <p class="muted" data-i="pickupOnly"></p>
    <div id="ckWrap"></div>
    <p class="err" id="cartErr"></p>
  </div>
</div>

<div class="overlay" id="modOv" role="dialog" aria-modal="true">
  <div class="sheet">
    <button class="xclose" data-x="modOv">✕</button>
    <h2 id="modName"></h2>
    <div id="modGroups"></div>
    <button class="btn btn-gold" id="modAdd"></button>
    <p class="err" id="modErr"></p>
  </div>
</div>

<script>
(function(){
"use strict";
var API="https://orders-service-production-ab21.up.railway.app";
/* Four kitchens. Only API-backed ones are orderable; the rest take phone
   orders until they're boarded on Clover. Coordinates approximate (gate
   sorting only, never sent anywhere). */
var KITCHENS=[
 {slug:"20th-ave",api:true,name:"20th Ave",area:{en:"Bensonhurst",ru:"Бенсонхёрст",zh:"本森赫斯特"},
  addr:"6201 20th Ave, Brooklyn, NY 11204",phone:"(718) 232-0525",tel:"+17182320525",lat:40.6175,lng:-73.9903,
  hours:{en:"Daily 11 am – 9 pm",ru:"Ежедневно 11:00–21:00",zh:"每日 11:00–21:00"}},
 {slug:"coney-island",api:true,name:"Coney Island Ave",area:{en:"Gravesend",ru:"Грейвсенд",zh:"格雷夫森德"},
  addr:"2376 Coney Island Ave, Brooklyn, NY 11223",phone:"(718) 233-8333",tel:"+17182338333",lat:40.6060,lng:-73.9663,
  hours:{en:"Daily 11 am – 10 pm",ru:"Ежедневно 11:00–22:00",zh:"每日 11:00–22:00"}},
 {slug:"emmons-ave",api:false,name:"Emmons Ave",area:{en:"Sheepshead Bay",ru:"Шипсхед-Бэй",zh:"羊头湾"},
  addr:"1809 Emmons Ave, Brooklyn, NY 11235",phone:"(718) 646-4441",tel:"+17186464441",lat:40.5838,lng:-73.9425,
  hours:{en:"Opening soon as Laghman Express",ru:"Скоро откроется как Laghman Express",zh:"即将以 Laghman Express 开业"}},
 {slug:"alpharetta",api:false,name:"Alpharetta, GA",area:{en:"Windward Plaza",ru:"Уиндворд-Плаза",zh:"温德沃德广场"},
  addr:"3070 Windward Plaza X1, Alpharetta, GA 30005",phone:"(470) 448-1919",tel:"+14704481919",lat:34.0900,lng:-84.2660,
  hours:{en:"Hours vary — call ahead",ru:"Часы уточняйте по телефону",zh:"营业时间请电话确认"}}
];
var STR={
 en:{back:"← Back to site",gateEyebrow:"Order pickup",gateH1:"Pick your kitchen.",
  gateSub:"Each kitchen cooks its own menu with its own prices — today's menu comes straight from the kitchen's register.",
  nearMe:"Find the nearest kitchen",geoNo:"Location unavailable — pick a kitchen below.",
  orderHere:"Order here",phoneOnly:"Phone orders",switchKitchen:"switch kitchen",
  liveNote:"Live menu and prices from this kitchen's register. Pickup only for now.",
  loading:"Loading the menu…",menuFail:"The menu is taking a break. Try again in a minute.",
  cart:"Your order",yourOrder:"Your order",empty:"Nothing here yet.",subtotal:"Subtotal",tax:"Tax",total:"Total",
  pickupOnly:"Pickup order — you'll collect it at the counter.",quoteWait:"Checking today's prices…",
  checkout:"Checkout",payOnline:"Pay online",name:"Name",phone:"Phone",email:"Email",
  payNote:"Payment opens on Clover's secure page.",
  notActive:"Online payment isn't switched on yet for this kitchen. Call and we'll take your order:",
  call:"Call",priceChanged:"The kitchen updated its menu — totals refreshed, please review.",
  netErr:"Connection hiccup. Try again.",required:"Please fill name, phone and email.",
  add:"Add",addFor:"Add for",mi:"mi",km:"km",choose:"Choose options"},
 ru:{back:"← На сайт",gateEyebrow:"Заказ с собой",gateH1:"Выберите кухню.",
  gateSub:"У каждой кухни своё меню и свои цены — сегодняшнее меню приходит прямо с кассы.",
  nearMe:"Найти ближайшую кухню",geoNo:"Геолокация недоступна — выберите кухню ниже.",
  orderHere:"Заказать здесь",phoneOnly:"Заказ по телефону",switchKitchen:"сменить кухню",
  liveNote:"Живое меню и цены с кассы этой кухни. Пока только самовывоз.",
  loading:"Загружаю меню…",menuFail:"Меню отдыхает. Попробуйте через минуту.",
  cart:"Ваш заказ",yourOrder:"Ваш заказ",empty:"Пока пусто.",subtotal:"Сумма",tax:"Налог",total:"Итого",
  pickupOnly:"Самовывоз — заберёте у стойки.",quoteWait:"Проверяю сегодняшние цены…",
  checkout:"Оформить",payOnline:"Оплатить онлайн",name:"Имя",phone:"Телефон",email:"Email",
  payNote:"Оплата откроется на защищённой странице Clover.",
  notActive:"Онлайн-оплата на этой кухне ещё не включена. Позвоните — примем заказ:",
  call:"Позвонить",priceChanged:"Кухня обновила меню — суммы пересчитаны, проверьте заказ.",
  netErr:"Сбой связи. Попробуйте ещё раз.",required:"Заполните имя, телефон и email.",
  add:"Добавить",addFor:"Добавить за",mi:"миль",km:"км",choose:"Выберите опции"},
 zh:{back:"← 返回主页",gateEyebrow:"下单自取",gateH1:"选择门店。",
  gateSub:"每家门店都有自己的菜单和价格——今日菜单直接来自门店收银系统。",
  nearMe:"查找最近的门店",geoNo:"无法获取位置——请在下方选择门店。",
  orderHere:"在线点餐",phoneOnly:"电话点餐",switchKitchen:"换一家门店",
  liveNote:"实时菜单与价格，直接来自该门店收银系统。目前仅支持自取。",
  loading:"菜单加载中…",menuFail:"菜单暂时不可用，请稍后再试。",
  cart:"我的订单",yourOrder:"我的订单",empty:"还没有加菜。",subtotal:"小计",tax:"税费",total:"合计",
  pickupOnly:"自取订单——请到柜台取餐。",quoteWait:"正在核对今日价格…",
  checkout:"去结算",payOnline:"在线支付",name:"姓名",phone:"电话",email:"邮箱",
  payNote:"将在 Clover 安全页面完成支付。",
  notActive:"该门店的在线支付尚未开通。请致电下单：",
  call:"拨打电话",priceChanged:"门店更新了菜单——金额已重新计算，请确认。",
  netErr:"网络不稳定，请重试。",required:"请填写姓名、电话和邮箱。",
  add:"加入",addFor:"加入 —",mi:"英里",km:"公里",choose:"选择规格"}
};
var lang=(function(){try{var s=localStorage.getItem("lx_lang");if(s==="ru"||s==="zh"||s==="en")return s;}catch(e){}
 var n=(navigator.language||"").toLowerCase();return n.indexOf("ru")===0?"ru":n.indexOf("zh")===0?"zh":"en";})();
var T=STR[lang];
var state={slug:null,menu:null,cart:[],quote:null,quoteBusy:false,cfg:null,idem:null};

function $(id){return document.getElementById(id)}
function money(c){return "$"+(c/100).toFixed(2)}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function applyLang(){
 document.documentElement.lang=lang==="zh"?"zh-CN":lang;T=STR[lang];
 try{localStorage.setItem("lx_lang",lang)}catch(e){}
 var els=document.querySelectorAll("[data-i]");
 for(var i=0;i<els.length;i++){els[i].textContent=T[els[i].getAttribute("data-i")]||""}
 var lb=$("lang");lb.innerHTML="";
 [["en","EN"],["ru","RU"],["zh","中文"]].forEach(function(p){
  var b=document.createElement("button");b.textContent=p[1];if(p[0]===lang)b.className="on";
  b.onclick=function(){lang=p[0];applyLang();renderGate();if(state.slug)renderMenuChrome();renderCart();};lb.appendChild(b);});
}
function haversine(a,b,c,d){var R=3958.8,p=Math.PI/180;
 var x=Math.sin((c-a)*p/2),y=Math.sin((d-b)*p/2);
 return 2*R*Math.asin(Math.sqrt(x*x+Math.cos(a*p)*Math.cos(c*p)*y*y));}

/* ---- gate ---- */
var userPos=null;
function renderGate(){
 var wrap=$("locCards");wrap.innerHTML="";
 var list=KITCHENS.slice();
 if(userPos){list.forEach(function(k){k._d=haversine(userPos.lat,userPos.lng,k.lat,k.lng)});
  list.sort(function(a,b){return a._d-b._d});}
 list.forEach(function(k,idx){
  var el=document.createElement(k.api?"button":"a");
  el.className="loc"+(k.api?"":" phone")+(userPos&&idx===0&&k.api?" nearest":"");
  if(k.api){el.onclick=function(){pickKitchen(k.slug)}}
  else{el.href="tel:"+k.tel}
  el.innerHTML='<span class="area">'+esc(k.area[lang])+'</span>'
  +(k._d!=null?'<span class="dist">'+(lang==="zh"?(k._d*1.609).toFixed(1)+" "+T.km:k._d.toFixed(1)+" "+T.mi)+"</span>":"")
  +"<h3>"+esc(k.name)+"</h3>"
  +'<span class="addr">'+esc(k.addr)+"<br>"+esc(k.hours[lang])+"</span><br>"
  +'<span class="tag">'+(k.api?T.orderHere:T.phoneOnly+" · "+k.phone)+"</span>";
  wrap.appendChild(el);});
}
$("geoBtn").onclick=function(){
 if(!navigator.geolocation){alert(T.geoNo);return}
 navigator.geolocation.getCurrentPosition(function(p){
  userPos={lat:p.coords.latitude,lng:p.coords.longitude};renderGate();
 },function(){alert(T.geoNo)},{maximumAge:600000,timeout:8000});
};

/* ---- menu ---- */
function pickKitchen(slug){
 state.slug=slug;try{localStorage.setItem("lx_kitchen",slug)}catch(e){}
 state.cart=loadCart();state.quote=null;
 $("gate").style.display="none";$("menu").style.display="block";
 renderMenuChrome();loadMenu();fetchCfg();updateBar();
}
function kitchen(){for(var i=0;i<KITCHENS.length;i++)if(KITCHENS[i].slug===state.slug)return KITCHENS[i];return null}
function renderMenuChrome(){
 var k=kitchen();if(!k)return;
 $("mTitle").textContent=k.name;
 $("kbtn").hidden=false;$("kname").textContent=k.name;
}
$("mSwitch").onclick=$("kbtn").onclick=function(){
 $("menu").style.display="none";$("gate").style.display="block";
 $("kbtn").hidden=true;state.slug=null;updateBar();window.scrollTo(0,0);
};
function loadMenu(){
 $("cats").innerHTML='<div class="skel">'+esc(T.loading)+"</div>";$("chips").innerHTML="";
 fetch(API+"/api/menu/"+state.slug).then(function(r){if(!r.ok)throw 0;return r.json()})
 .then(function(m){state.menu=m;renderMenu()})
 .catch(function(){$("cats").innerHTML='<div class="skel">'+esc(T.menuFail)+"</div>"});
}
function renderMenu(){
 var cats=state.menu.categories||[];
 var chips=$("chips");chips.innerHTML="";
 var wrap=$("cats");wrap.innerHTML="";
 cats.forEach(function(c,ci){
  if(!c.items||!c.items.length)return;
  var chip=document.createElement("button");chip.className="chip"+(ci===0?" on":"");chip.textContent=c.name;
  chip.onclick=function(){document.getElementById("cat-"+ci).scrollIntoView({behavior:"smooth",block:"start"});
   var cs=chips.children;for(var i=0;i<cs.length;i++)cs[i].className="chip";chip.className="chip on";};
  chips.appendChild(chip);
  var sec=document.createElement("div");sec.className="cat";sec.id="cat-"+ci;
  sec.innerHTML="<h2>"+esc(c.name)+"</h2>";
  var grid=document.createElement("div");grid.className="items";
  c.items.forEach(function(it){
   var d=document.createElement("div");d.className="it";
   d.innerHTML='<span class="nm">'+esc(it.name)+'</span><span class="pr">'+money(it.priceCents)+"</span>";
   var b=document.createElement("button");b.className="add";b.textContent="+";b.setAttribute("aria-label",T.add+" "+it.name);
   b.onclick=function(){tryAdd(it)};
   d.appendChild(b);grid.appendChild(d);});
  sec.appendChild(grid);wrap.appendChild(sec);});
}

/* ---- modifiers ---- */
var modCtx=null;
function tryAdd(it){
 fetch(API+"/api/menu/"+state.slug+"/items/"+it.id+"/modifiers")
 .then(function(r){return r.ok?r.json():{groups:[]}})
 .then(function(m){
  var groups=(m.groups||[]).filter(function(g){return g.modifiers&&g.modifiers.length});
  if(!groups.length){addLine(it,[],[]);return}
  modCtx={item:it,groups:groups};openMod();
 }).catch(function(){addLine(it,[],[])});
}
function openMod(){
 $("modName").textContent=modCtx.item.name;
 var wrap=$("modGroups");wrap.innerHTML="";$("modErr").textContent="";
 modCtx.groups.forEach(function(g,gi){
  var min=g.minRequired||0,max=g.maxAllowed||0;
  var multi=!(max===1);
  var d=document.createElement("div");d.className="grp";
  d.innerHTML="<h3>"+esc(g.name||T.choose)+(min>0?" *":"")+"</h3>";
  (g.modifiers||[]).forEach(function(mo){
   var l=document.createElement("label");l.className="m";
   l.innerHTML='<input type="'+(multi?"checkbox":"radio")+'" name="g'+gi+'" value="'+esc(mo.id)+'">'
    +"<span>"+esc(mo.name)+"</span>"+(mo.priceCents?'<span class="pr">+'+money(mo.priceCents)+"</span>":"");
   d.appendChild(l);});
  wrap.appendChild(d);});
 $("modAdd").textContent=T.add;
 $("modOv").classList.add("open");
}
$("modAdd").onclick=function(){
 var ids=[],names=[];
 var ok=true;
 modCtx.groups.forEach(function(g,gi){
  var sel=document.querySelectorAll('#modGroups [name="g'+gi+'"]:checked');
  var min=g.minRequired||0,max=g.maxAllowed||0;
  if(sel.length<min||(max>0&&sel.length>max)){ok=false}
  for(var i=0;i<sel.length;i++){ids.push(sel[i].value);
   var lbl=sel[i].parentNode.querySelector("span");names.push(lbl?lbl.textContent:"");}
 });
 if(!ok){$("modErr").textContent=T.choose;return}
 $("modOv").classList.remove("open");
 addLine(modCtx.item,ids,names);
};

/* ---- cart ---- */
function cartKey(){return "lx_cart_"+state.slug}
function loadCart(){try{return JSON.parse(localStorage.getItem(cartKey())||"[]")}catch(e){return []}}
function saveCart(){try{localStorage.setItem(cartKey(),JSON.stringify(state.cart))}catch(e){}}
function addLine(it,modIds,modNames){
 var key=it.id+"|"+modIds.slice().sort().join(",");
 var ln=null;for(var i=0;i<state.cart.length;i++)if(state.cart[i].key===key)ln=state.cart[i];
 if(ln){ln.quantity=Math.min(20,ln.quantity+1)}
 else state.cart.push({key:key,itemId:it.id,name:it.name,mods:modNames,modifierIds:modIds,quantity:1});
 saveCart();updateBar();requestQuote();
}
function updateBar(){
 var n=0;state.cart.forEach(function(l){n+=l.quantity});
 $("bar").style.display=state.slug&&n>0?"flex":"none";
 $("barTot").textContent=state.quote?money(state.quote.totalCents):(n+" ×");
}
$("barBtn").onclick=function(){renderCart();$("cartOv").classList.add("open")};
document.querySelectorAll(".xclose").forEach(function(b){
 b.onclick=function(){$(b.getAttribute("data-x")).classList.remove("open")}});
[["cartOv"],["modOv"]].forEach(function(p){
 $(p[0]).addEventListener("click",function(e){if(e.target===this)this.classList.remove("open")});});

function renderCart(){
 var w=$("lines");w.innerHTML="";
 if(!state.cart.length){w.innerHTML='<p class="muted">'+esc(T.empty)+"</p>"}
 state.cart.forEach(function(l,li){
  var d=document.createElement("div");d.className="line";
  d.innerHTML='<span class="nm">'+esc(l.name)+(l.mods&&l.mods.length?"<small>"+esc(l.mods.join(", "))+"</small>":"")+"</span>";
  var q=document.createElement("span");q.className="qty";
  var minus=document.createElement("button");minus.textContent="–";
  minus.onclick=function(){l.quantity--;if(l.quantity<=0)state.cart.splice(li,1);saveCart();renderCart();updateBar();requestQuote()};
  var num=document.createElement("b");num.textContent=l.quantity;
  var plus=document.createElement("button");plus.textContent="+";
  plus.onclick=function(){l.quantity=Math.min(20,l.quantity+1);saveCart();renderCart();updateBar();requestQuote()};
  q.appendChild(minus);q.appendChild(num);q.appendChild(plus);
  d.appendChild(q);w.appendChild(d);});
 renderTotals();renderCheckout();
}
function renderTotals(){
 var t=$("totals");
 if(!state.cart.length){t.innerHTML="";return}
 if(state.quoteBusy||!state.quote){t.innerHTML='<div class="muted">'+esc(T.quoteWait)+"</div>";return}
 t.innerHTML='<div><span>'+esc(T.subtotal)+"</span><span>"+money(state.quote.subtotalCents)+"</span></div>"
 +"<div><span>"+esc(T.tax)+"</span><span>"+money(state.quote.taxCents)+"</span></div>"
 +'<div class="g"><span>'+esc(T.total)+"</span><span>"+money(state.quote.totalCents)+"</span></div>";
}
var quoteTimer=null;
function requestQuote(){
 if(!state.cart.length){state.quote=null;renderTotals();updateBar();return}
 state.quoteBusy=true;renderTotals();
 clearTimeout(quoteTimer);
 quoteTimer=setTimeout(function(){
  fetch(API+"/api/quotes",{method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({locationSlug:state.slug,fulfillment:"pickup",
    cart:state.cart.map(function(l){return{itemId:l.itemId,quantity:l.quantity,modifierIds:l.modifierIds}})})})
  .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})})
  .then(function(res){
   state.quoteBusy=false;
   if(res.ok){state.quote=res.j;state.idem=null;$("cartErr").textContent=""}
   else{state.quote=null;$("cartErr").textContent=res.j&&res.j.error||T.netErr}
   renderTotals();updateBar();})
  .catch(function(){state.quoteBusy=false;state.quote=null;$("cartErr").textContent=T.netErr;renderTotals()});
 },500);
}

/* ---- checkout ---- */
function fetchCfg(){
 state.cfg=null;
 fetch(API+"/api/checkout/config/"+state.slug).then(function(r){return r.json()})
 .then(function(c){state.cfg=c;renderCheckout()}).catch(function(){});
}
function hostedActive(){return state.cfg&&state.cfg.paymentsEnabled&&state.cfg.checkoutMode==="hosted_checkout"}
function renderCheckout(){
 var w=$("ckWrap");if(!state.cart.length){w.innerHTML="";return}
 var k=kitchen();
 if(hostedActive()){
  w.innerHTML='<label>'+esc(T.name)+'</label><input id="cN" autocomplete="name">'
  +"<label>"+esc(T.phone)+'</label><input id="cP" autocomplete="tel" inputmode="tel">'
  +"<label>"+esc(T.email)+'</label><input id="cE" autocomplete="email" inputmode="email">'
  +'<button class="btn btn-gold" id="payBtn">'+esc(T.payOnline)+"</button>"
  +'<p class="muted">'+esc(T.payNote)+"</p>";
  $("payBtn").onclick=startHosted;
 }else{
  w.innerHTML='<div class="note-call">'+esc(T.notActive)
  +'<br><br><a class="btn btn-gold" href="tel:'+k.tel+'">'+esc(T.call)+" · "+esc(k.phone)+"</a></div>";
 }
}
function startHosted(){
 var n=$("cN").value.trim(),p=$("cP").value.trim(),e=$("cE").value.trim();
 if(n.length<2||p.length<7||e.indexOf("@")<1){$("cartErr").textContent=T.required;return}
 if(!state.quote){requestQuote();return}
 if(!state.idem)state.idem=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+"-"+Math.random());
 var btn=$("payBtn");btn.disabled=true;btn.innerHTML='<span class="spin"></span>';
 fetch(API+"/api/hosted-checkout/sessions",{method:"POST",
  headers:{"Content-Type":"application/json","Idempotency-Key":state.idem},
  body:JSON.stringify({quoteId:state.quote.quoteId,menuVersion:state.quote.menuVersion,
   expectedTotalCents:state.quote.totalCents,customer:{name:n,phone:p,email:e}})})
 .then(function(r){return r.json().then(function(j){return{s:r.status,j:j}})})
 .then(function(res){
  if(res.s===201&&res.j.href){
   try{localStorage.removeItem(cartKey())}catch(x){}
   location.href=res.j.href;return}
  btn.disabled=false;btn.textContent=T.payOnline;
  if(res.j&&res.j.code==="PRICE_CHANGED"){state.idem=null;$("cartErr").textContent=T.priceChanged;requestQuote();return}
  if(res.j&&res.j.code==="HOSTED_CHECKOUT_NOT_ACTIVE"){state.cfg=null;fetchCfg();renderCheckout();return}
  $("cartErr").textContent=res.j&&res.j.error||T.netErr;})
 .catch(function(){btn.disabled=false;btn.textContent=T.payOnline;$("cartErr").textContent=T.netErr});
}

/* ---- boot ---- */
applyLang();renderGate();
var saved=null;try{saved=localStorage.getItem("lx_kitchen")}catch(e){}
var savedK=null;
if(saved){for(var i=0;i<KITCHENS.length;i++)if(KITCHENS[i].slug===saved&&KITCHENS[i].api)savedK=KITCHENS[i];}
if(savedK){pickKitchen(savedK.slug)}
else if(navigator.permissions&&navigator.permissions.query){
 navigator.permissions.query({name:"geolocation"}).then(function(st){
  if(st.state==="granted")$("geoBtn").click();}).catch(function(){});
}
})();
</script>
